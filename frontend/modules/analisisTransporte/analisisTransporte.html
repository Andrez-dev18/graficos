<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Transportes - Liquidación de Placas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-100 h-screen m-0 p-0 font-sans">
    <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">
        <div class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl">
            <div class="flex items-center gap-3 px-4 py-3 sm:px-5">
                <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                    <i class="fa-solid fa-truck-fast text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Análisis de Transportes</h1>
                    <p class="text-xs text-slate-500">Liquidación de placas por fecha, cliente y código de movimiento.</p>
                </div>
            </div>
            <div class="px-3 py-2 sm:px-4">
                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <i id="icon-toggle-filtros" class="fa-solid fa-chevron-up transition-transform duration-300"></i>
                </button>
            </div>
        </div>

        <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
            <div class="flex flex-wrap items-end gap-3 sm:gap-4">
                <div class="flex flex-col">
                    <label for="select-tipo-grafico" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO DE GRÁFICO</label>
                    <select id="select-tipo-grafico" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[190px]">
                        <option value="LiquidacionPlacas" selected>LiquidacionPlacas</option>
                        <option value="CorrelacionGral">CorrelacionGral</option>
                    </select>
                </div>
                <div class="flex flex-wrap items-end gap-3">
                    <div class="flex flex-col">
                        <label for="select-tipo-periodo" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERIODO</label>
                        <select id="select-tipo-periodo"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="entre_fechas" selected>Entre fechas</option>
                            <option value="por_fecha">Por fecha</option>
                            <option value="ultima_semana">Última semana</option>
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses">Entre meses</option>
                        </select>
                    </div>
                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2"></div>
                </div>

                <div class="flex items-center gap-2 ml-auto sm:ml-0">
                    <button id="btn-cargar" type="button"
                        class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                        <i class="fa-solid fa-rotate"></i><span>Cargar</span>
                    </button>
                    <button id="btn-limpiar" type="button"
                        class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <span>Limpiar</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="contenedor-graficos-lista" class="flex flex-col gap-6 mt-6 pb-12"></div>

    <script src="../../core/config.js"></script>
    <script src="../../assets/utils-graficos/periodo-helper.js?v=20261028_1"></script>
    <script src="charts/chart.liquidacionPlacas.js?v=20261026_9"></script>
    <script src="analisisTransporte.service.js?v=20261026_1"></script>
    <script src="analisisTransporte.controller.js?v=20261026_3"></script>
</body>
</html>
