<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Costo Diario - PLANTA ALIMENTO</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen m-0 p-0 font-sans">

    <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">
        
        <!-- BARRA SUPERIOR DE CABECERA Y TOGGLE -->
        <div id="cabecera-filtros"
            class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl transition-all">
            <div class="flex items-center gap-3 px-4 py-3 sm:px-5">
                <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">PLANTA ALIMENTO - Análisis Costo Diario</h1>
                    <p class="text-xs text-slate-500">Costo Formula Por Tipo AABB / Insumos / Revisión Insumos</p>
                </div>
            </div>

            <!-- BOTÓN TOGGLE DE FILTROS -->
            <div class="flex items-center gap-2 px-3 py-2 sm:px-4">
                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <svg id="icon-toggle-filtros" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DE FILTROS -->
        <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
            <div class="flex flex-wrap items-end gap-3 sm:gap-4">
                
                <!-- 1. PERIODO Y CONTENEDOR DINÁMICO DE FECHAS (PERIODO-HELPER) -->
                <div class="flex flex-wrap items-end gap-3">
                    <div class="flex flex-col">
                        <label for="select-tipo-periodo" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERIODO</label>
                        <select id="select-tipo-periodo"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="entre_fechas" selected>Entre fechas</option>
                            <option value="por_fecha">Por fecha</option>
                            <option value="ultima_semana">Última semana</option>
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses">Entre meses</option>
                        </select>
                    </div>

                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2">
                        <!-- Generado dinámicamente por PeriodoHelper -->
                    </div>
                </div>

                <!-- 2. SELECT DE DASHBOARD -->
                <div class="flex flex-col">
                    <label for="select-dashboard" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">DASHBOARD</label>
                    <select id="select-dashboard"
                        class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                        <option value="CostoFormulaPorTipoAABB">Costo Formula Por Tipo AABB</option>
                        <option value="CostoFormula-Insumos">Costo Formula - Insumos</option>
                        <option value="RevisionInsumos">Revisión Insumos</option>
                        <option value="RevisionAlimento">Revisión Alimento</option>
                    </select>
                </div>

                <!-- BOTONES DE ACCIÓN -->
                <div class="flex items-center gap-2 ml-auto sm:ml-0">
                    <button id="btn-cargar" type="button"
                        class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        <span>Cargar</span>
                    </button>
                    <button id="btn-limpiar" type="button"
                        class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <span>Limpiar</span>
                    </button>
                </div>

            </div>

            <!-- FILTROS ADICIONALES ESPECÍFICOS PARA REVISIÓN INSUMOS (CUSTOM-MULTISELECT) -->
            <div id="contenedor-filtros-revision-insumos" class="hidden flex-wrap items-end gap-3 sm:gap-4 mt-3 pt-3 border-t border-slate-200/80">
                <!-- 1. FECHA HISTÓRICA (fechahisto) - Input Libre de Fecha -->
                <div class="flex flex-col">
                    <label for="input-fechahisto" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">FECHA HISTÓRICA</label>
                    <input type="date" id="input-fechahisto" value="2026-02-26"
                        class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                </div>

                <!-- 2. MULTISELECT TIPO (INSUMO, FABRICACIO) -->
                <div id="contenedor-filtro-tipo-revision" class="relative flex flex-col transition-all">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO</label>
                    <button id="btn-dropdown-tipo-revision" type="button"
                        class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[130px]">
                        <span id="label-tipo-revision" class="truncate text-left select-none">INSUMO</span>
                        <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="dropdown-tipo-revision"
                        class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-48 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                        <input id="search-tipo-revision" type="text" placeholder="Buscar tipo..."
                            class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                        <div id="container-options-tipo-revision" class="max-h-52 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs">
                            <!-- Renderizado dinámico por CustomMultiSelect -->
                        </div>
                    </div>
                </div>

                <!-- 3. MULTISELECT TRANSACCIÓN (S003, E003, S811) -->
                <div id="contenedor-filtro-transaccion-revision" class="relative flex flex-col transition-all">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TRANSACCIÓN</label>
                    <button id="btn-dropdown-transaccion-revision" type="button"
                        class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[130px]">
                        <span id="label-transaccion-revision" class="truncate text-left select-none">S003</span>
                        <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="dropdown-transaccion-revision"
                        class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-48 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                        <input id="search-transaccion-revision" type="text" placeholder="Buscar transacción..."
                            class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                        <div id="container-options-transaccion-revision" class="max-h-52 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs">
                            <!-- Renderizado dinámico por CustomMultiSelect -->
                        </div>
                    </div>
                </div>

                <!-- 4. MULTISELECT ÍTEMS (Búsqueda y selección múltiple de insumos) -->
                <div id="contenedor-filtro-items-revision" class="relative flex flex-col transition-all">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">ITEMS</label>
                    <button id="btn-dropdown-items-revision" type="button"
                        class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[200px] max-w-[320px]">
                        <span id="label-items-revision" class="truncate text-left select-none">9 seleccionados</span>
                        <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="dropdown-items-revision"
                        class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-80 sm:w-96 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                        <input id="search-items-revision" type="text" placeholder="Buscar ítem por nombre o código..."
                            class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                        <div id="container-options-items-revision" class="max-h-60 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs">
                            <!-- Renderizado dinámico por CustomMultiSelect -->
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- CONTENEDOR PRINCIPAL DE GRÁFICOS / DASHBOARD -->
    <div id="contenedor-graficos-lista" class="flex flex-col gap-6 mt-6 pb-12 w-full">
        <!-- Renderizado dinámico por ChartRegistry -->
    </div>

    <!-- SCRIPTS Y DEPENDENCIAS -->
    <script src="../../core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="../../assets/utils-graficos/periodo-helper.js?v=20260930_1"></script>
    <script src="../../assets/utils-graficos/custom-multiselect.js?v=20260930_1"></script>
    <script src="../../assets/utils-graficos/excel-export-helper.js?v=20260930_1"></script>

    <!-- Componentes de Dashboards -->
    <script src="charts/chart.costo_formula_por_tipo_aabb.js?v=20260930_5"></script>
    <script src="charts/chart.costo_formula_insumos.js?v=20260930_5"></script>
    <script src="charts/chart.revision_insumos.js?v=20260930_5"></script>
    <script src="charts/chart.revision_alimento.js?v=20260930_5"></script>

    <!-- Servicio y Controlador -->
    <script src="AnalisisCostoDiario.service.js?v=20260930_5"></script>
    <script src="AnalisisCostoDiario.controller.js?v=20260930_5"></script>
</body>

</html>
