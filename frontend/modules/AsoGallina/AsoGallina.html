<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aso Gallina - Análisis de Gallina</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen m-0 p-0 font-sans">

    <!-- LOADER INICIAL -->
    <div id="loader-inicial-pagina"
        class="fixed inset-0 z-50 bg-slate-50/90 backdrop-blur-xs flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="flex flex-col items-center gap-4 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-200/90 text-center max-w-xs mx-4">
            <div class="relative flex items-center justify-center">
                <div class="w-12 h-12 rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-blue-600">
                    <i class="fas fa-chart-line text-base"></i>
                </div>
            </div>
            <div>
                <h3 class="text-sm font-bold text-slate-800">Cargando Aso Gallina</h3>
                <p class="text-xs text-slate-500 mt-1">Obteniendo datos de producción y pesos...</p>
            </div>
        </div>
    </div>

    <!-- CABECERA Y FILTROS -->
    <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">
        <div id="cabecera-filtros"
            class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl transition-all">
            <div class="flex items-center gap-3 px-4 py-3 sm:px-5">
                <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                    <i class="fas fa-feather-alt text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Aso Gallina</h1>
                    <p id="subtitulo-modulo-asogallina" class="text-xs text-slate-500">DashGallina · Unidades, Pesos Promedios y Kilogramos</p>
                </div>
            </div>

            <div class="flex items-center gap-2 px-3 py-2 sm:px-4">
                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <svg id="icon-toggle-filtros" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
            <div class="flex flex-wrap items-end gap-3 sm:gap-4">
                
                <!-- SELECT TIPO DE GRÁFICO -->
                <div class="flex flex-col">
                    <label for="select-tipo-grafico"
                        class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO DE GRÁFICO</label>
                    <select id="select-tipo-grafico"
                        class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[240px]">
                        <option value="DashGallina" selected>DashGallina (Todos)</option>
                        <option value="GallUnd">GallUnd (Unidades)</option>
                        <option value="GallPeso">GallPeso (Peso Promedio)</option>
                        <option value="GallKilos">GallKilos (Kilogramos)</option>
                    </select>
                </div>

                <!-- FILTROS DE PERIODO (PeriodoHelper) -->
                <div id="filtros-periodo-fechas" class="flex flex-wrap items-end gap-3 sm:gap-4">
                    <div class="flex flex-col">
                        <label for="select-tipo-periodo"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERIODO</label>
                        <select id="select-tipo-periodo"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses">Entre meses</option>
                            <option value="por_fecha">Por fecha</option>
                            <option value="entre_fechas" selected>Entre fechas</option>
                            <option value="ultima_semana">Última semana</option>
                            <option value="entre_semanas">Entre semanas</option>
                        </select>
                    </div>

                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2"></div>
                </div>

                <!-- MULTISELECT TIPO DE GALLINA -->
                <div id="filtro-tipo" class="relative flex flex-col">
                    <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO DE GALLINA</label>
                    <button id="ms-tipo-btn" type="button"
                        class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[240px] max-w-[340px]">
                        <span id="ms-tipo-label" class="truncate text-left select-none">GALLINA REPRODUCTORA</span>
                        <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div id="ms-tipo-dropdown"
                        class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-80 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                        <input id="ms-tipo-search" type="text" placeholder="Buscar tipo..."
                            class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                        <div id="ms-tipo-options" class="max-h-64 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs"></div>
                    </div>
                </div>

                <!-- BOTONES DE ACCIÓN -->
                <div id="acciones-grafico" class="flex items-center gap-2 ml-auto sm:ml-0">
                    <button id="btn-cargar" type="button"
                        class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        <span>Cargar</span>
                    </button>
                    <button id="btn-limpiar" type="button"
                        class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <span>Limpiar</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ERROR -->
    <div id="mensaje-error"
        class="hidden mt-3 bg-red-50 border border-red-200 text-red-700 text-sm font-medium rounded-xl px-4 py-3"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="contenedor-graficos-lista" class="flex flex-col gap-6 mt-6 pb-10"></div>

    <script src="../../core/config.js"></script>
    <script src="../../assets/utils-graficos/loading-helper.js"></script>
    <script src="../../assets/utils-graficos/custom-multiselect.js?v=20261022_6"></script>
    <script src="../../assets/utils-graficos/periodo-helper.js?v=20261028_1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="charts/chart.asogallina.dashgallina.js?v=20261023_12"></script>
    <script src="AsoGallina.service.js?v=20261023_1"></script>
    <script src="AsoGallina.controller.js?v=20261023_1"></script>
</body>

</html>
