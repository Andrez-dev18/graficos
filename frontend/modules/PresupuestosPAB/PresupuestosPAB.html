<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestos PAB - LIMA 1</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen m-0 p-0 font-sans">

    <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">
        
        <!-- BARRA SUPERIOR DE CABECERA Y TOGGLE -->
        <div id="cabecera-filtros"
            class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl transition-all">
            <div class="flex items-center gap-3 px-4 py-3 sm:px-5">
                <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Presupuestos PAB</h1>
                    <p class="text-xs text-slate-500">Monitoreo y Control de Presupuestos Planta de Alimento</p>
                </div>
            </div>

            <!-- BOTÓN TOGGLE DE FILTROS -->
            <div class="flex items-center gap-2 px-3 py-2 sm:px-4">
                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <svg id="icon-toggle-filtros" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DE FILTROS -->
        <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
            <div class="flex flex-wrap items-end gap-3 sm:gap-4">
                
                <!-- 1. PERIODO Y CONTENEDOR DINÁMICO DE FECHAS (PERIODO-HELPER) -->
                <div class="flex flex-wrap items-end gap-3">
                    

                    <!-- SELECT TIPO DE REPORTE / DASHBOARD -->
                    <div class="flex flex-col">
                        <label for="select-tipo-grafico"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">REPORTE / HOJA</label>
                        <select id="select-tipo-grafico"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="DashPresupuesto" selected>DashPresupuesto</option>
                            <option value="AnalisisPartidas">AnalisisPartidas</option>
                            <option value="DashComparativoCronoRC">DashComparativoCronoRC</option>
                        </select>
                    </div>

                    <!-- SELECT FILTRO PRESUPUESTO / CÓDIGO -->
                    <div id="contenedor-filtro-presupuesto" class="flex flex-col">
                        <label for="select-filtro-presupuesto"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PRESUPUESTO</label>
                        <select id="select-filtro-presupuesto"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="202403" selected>202403</option>
                            <option value="202403%">202403%</option>
                            <option value="202404">202404</option>
                            <option value="202404%">202404%</option>
                            <option value="202410">202410</option>
                            <option value="202410%">202410%</option>
                            <option value="202503">202503</option>
                            <option value="202503%">202503%</option>
                        </select>
                    </div>

                    <!-- CHECKBOX MOSTRAR AMBOS (RESUMEN + DETALLE) -->
                    <div id="contenedor-check-combinar" class="flex items-center gap-2 pb-2 pl-1">
                        <label class="relative flex items-center gap-2 cursor-pointer select-none group">
                            <input type="checkbox" id="check-mostrar-ambos"
                                class="w-4 h-4 text-blue-600 bg-white border-slate-300 rounded focus:ring-blue-500 focus:ring-2 cursor-pointer">
                            <span class="text-xs font-semibold text-slate-700 group-hover:text-blue-600 transition-colors">
                                Mostrar ambos (Resumen % + Detalle)
                            </span>
                        </label>
                    </div>
                </div>

                <!-- BOTONES DE ACCIÓN -->
                <div class="flex items-center gap-2 ml-auto sm:ml-0">
                    <button id="btn-cargar" type="button"
                        class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        <span>Cargar</span>
                    </button>
                    <button id="btn-limpiar" type="button"
                        class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <span>Limpiar</span>
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- CONTENEDOR PRINCIPAL DE REPORTES / TABLAS -->
    <div id="contenedor-graficos-lista" class="flex flex-col gap-6 mt-6 pb-12">
        <!-- Renderizado dinámico por ChartRegistry -->
    </div>

    <!-- SCRIPTS Y DEPENDENCIAS -->
    <script src="../../core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="../../assets/utils-graficos/periodo-helper.js?v=20260924_1"></script>
    <script src="../../assets/utils-graficos/custom-multiselect.js?v=20260924_1"></script>
    <script src="../../assets/utils-graficos/excel-export-helper.js?v=20260924_1"></script>
    <script src="charts/chart.presupuesto202403.js?v=20260924_1"></script>
    <script src="charts/chart.presupuesto202403pct.js?v=20260924_1"></script>
    <script src="charts/chart.presupuesto202404.js?v=20260924_1"></script>
    <script src="charts/chart.presupuesto202404pct.js?v=20260924_1"></script>
    <script src="charts/chart.presupuesto202410.js?v=20260924_1"></script>
    <script src="charts/chart.presupuesto202410pct.js?v=20260924_1"></script>
    <script src="charts/chart.presupuesto202503.js?v=20260924_1"></script>
    <script src="charts/chart.presupuesto202503pct.js?v=20260924_1"></script>
    <script src="charts/chart.analisispartidas.js?v=20260924_1"></script>
    <script src="charts/chart.comparativocronorc.js?v=20260924_1"></script>
    <script src="PresupuestosPAB.service.js?v=20260924_1"></script>
    <script src="PresupuestosPAB.controller.js?v=20260924_1"></script>
</body>

</html>
