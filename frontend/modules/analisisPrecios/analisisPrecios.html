<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Precios - LIMA 1</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen m-0 p-0 font-sans">

    <!-- LOADER INICIAL DE PÁGINA (CARGA DE FILTROS Y CONFIGURACIÓN) -->
    <div id="loader-inicial-pagina"
        class="fixed inset-0 z-50 bg-slate-50/90 backdrop-blur-xs flex flex-col items-center justify-center transition-opacity duration-300">
        <div
            class="flex flex-col items-center gap-4 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-200/90 text-center max-w-xs mx-4">
            <div class="relative flex items-center justify-center">
                <div class="w-12 h-12 rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-blue-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                </div>
            </div>
            <div>
                <h3 class="text-sm font-bold text-slate-800">Cargando Análisis de Precios</h3>
                <p class="text-xs text-slate-500 mt-1">Obteniendo configuración y filtros...</p>
            </div>
        </div>
    </div>

    <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">
        
        <!-- BARRA SUPERIOR DE CABECERA Y TOGGLE -->
        <div id="cabecera-filtros"
            class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl transition-all">
            <div class="flex items-center gap-3 px-4 py-3 sm:px-5">
                <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z">
                        </path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Análisis de Precios</h1>
                    <p class="text-xs text-slate-500">Evolución y comparación de precios unitarios, pesos e importes por ítem y transacción</p>
                </div>
            </div>

            <!-- BOTÓN TOGGLE DE FILTROS -->
            <div class="flex items-center gap-2 px-3 py-2 sm:px-4">
                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <svg id="icon-toggle-filtros" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DE FILTROS -->
        <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
            <div class="flex flex-wrap items-end gap-3 sm:gap-4">
                
                <!-- 1. PERIODO Y CONTENEDOR DINÁMICO DE FECHAS (PERIODO-HELPER) -->
                <div class="flex flex-wrap items-end gap-3">
                    <div class="flex flex-col">
                        <label for="select-tipo-periodo" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERIODO</label>
                        <select id="select-tipo-periodo"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="entre_fechas" selected>Entre fechas</option>
                            <option value="por_fecha">Por fecha</option>
                            <option value="ultima_semana">Última semana</option>
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses">Entre meses</option>
                        </select>
                    </div>

                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2">
                        <!-- Generado dinámicamente por PeriodoHelper -->
                    </div>

                    <!-- SELECT TIPO DE GRÁFICO (SELECCIÓN ÚNICA) -->
                    <div class="flex flex-col">
                        <label for="select-tipo-grafico"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO DE GRÁFICO</label>
                        <select id="select-tipo-grafico"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="DashAnalisiPrecios" selected>DashAnalisiPrecios</option>
                            <option value="AnalisisPreciosELS">AnalisisPreciosELS</option>
                            <option value="DashRegaloELS">DashRegaloELS</option>
                        </select>
                    </div>

                    <!-- 1. MULTISELECT TDOC -->
                    <div id="contenedor-filtro-tdoc-precios" class="relative flex flex-col transition-all">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TDOC</label>
                        <button id="btn-dropdown-tdoc-precios" type="button"
                            class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[120px]">
                            <span id="label-tdoc-precios" class="truncate text-left select-none">(Todo)</span>
                            <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="dropdown-tdoc-precios"
                            class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-52 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                            <input id="search-tdoc-precios" type="text" placeholder="Buscar documento..."
                                class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                            <div id="container-options-tdoc-precios" class="max-h-52 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs">
                                <!-- Renderizado dinámico -->
                            </div>
                        </div>
                    </div>

                    <!-- 2. MULTISELECT LINEA VENTA -->
                    <div id="contenedor-filtro-linea-precios" class="relative flex flex-col transition-all">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">LINEA VENTA</label>
                        <button id="btn-dropdown-linea-precios" type="button"
                            class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[170px]">
                            <span id="label-linea-precios" class="truncate text-left select-none">(Todo)</span>
                            <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="dropdown-linea-precios"
                            class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-64 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                            <input id="search-linea-precios" type="text" placeholder="Buscar línea..."
                                class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                            <div id="container-options-linea-precios" class="max-h-52 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs">
                                <!-- Renderizado dinámico -->
                            </div>
                        </div>
                    </div>

                    <!-- 3. MULTISELECT CORPORATIVO -->
                    <div id="contenedor-filtro-corporativo-precios" class="relative flex flex-col transition-all">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">CORPORATIVO</label>
                        <button id="btn-dropdown-corporativo-precios" type="button"
                            class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[190px]">
                            <span id="label-corporativo-precios" class="truncate text-left select-none">(Todo)</span>
                            <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="dropdown-corporativo-precios"
                            class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-72 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                            <input id="search-corporativo-precios" type="text" placeholder="Buscar corporativo..."
                                class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                            <div id="container-options-corporativo-precios" class="max-h-52 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs">
                                <!-- Renderizado dinámico -->
                            </div>
                        </div>
                    </div>

                    <!-- 4. MULTISELECT NOMCLIENTE -->
                    <div id="contenedor-filtro-cliente-precios" class="relative flex flex-col transition-all">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">NOMCLIENTE</label>
                        <button id="btn-dropdown-cliente-precios" type="button"
                            class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[190px]">
                            <span id="label-cliente-precios" class="truncate text-left select-none">(Todo)</span>
                            <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="dropdown-cliente-precios"
                            class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-72 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                            <input id="search-cliente-precios" type="text" placeholder="Buscar cliente..."
                                class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                            <div id="container-options-cliente-precios" class="max-h-52 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs">
                                <!-- Renderizado dinámico -->
                            </div>
                        </div>
                    </div>

                    <!-- 5. MULTISELECT PROVINCIA -->
                    <div id="contenedor-filtro-provincia-precios" class="relative flex flex-col transition-all">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PROVINCIA</label>
                        <button id="btn-dropdown-provincia-precios" type="button"
                            class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[150px]">
                            <span id="label-provincia-precios" class="truncate text-left select-none">(Todo)</span>
                            <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="dropdown-provincia-precios"
                            class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-56 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                            <input id="search-provincia-precios" type="text" placeholder="Buscar provincia..."
                                class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                            <div id="container-options-provincia-precios" class="max-h-52 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs">
                                <!-- Renderizado dinámico -->
                            </div>
                        </div>
                    </div>

                    <!-- 6. MULTISELECT ZONA -->
                    <div id="contenedor-filtro-zona-precios" class="relative flex flex-col transition-all">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">ZONA</label>
                        <button id="btn-dropdown-zona-precios" type="button"
                            class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[180px]">
                            <span id="label-zona-precios" class="truncate text-left select-none">(Todo)</span>
                            <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="dropdown-zona-precios"
                            class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-64 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                            <input id="search-zona-precios" type="text" placeholder="Buscar zona..."
                                class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                            <div id="container-options-zona-precios" class="max-h-52 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs">
                                <!-- Renderizado dinámico -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- BOTONES DE ACCIÓN -->
                <div class="flex items-center gap-2 ml-auto sm:ml-0">
                    <button id="btn-cargar" type="button"
                        class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        <span>Cargar</span>
                    </button>
                    <button id="btn-limpiar" type="button"
                        class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <span>Limpiar</span>
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- CONTENEDOR PRINCIPAL DE PANELES 1X1 -->
    <div id="contenedor-graficos-lista" class="flex flex-col gap-6 mt-6 pb-12">

        <!-- 1. GRAFICA PRINCIPAL / TABLA ANALISIS PRECIOS -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col">
            <div id="card-header-grafica-principal" class="hidden px-6 py-4 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 shrink-0">
                <div class="flex items-center gap-2.5">
                    <h2 id="titulo-grafica-principal" class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">
                        DashAnalisiPrecios
                    </h2>
                </div>
            </div>

            <div id="contenedor-grafica-costo" class="relative w-full min-h-[420px] p-0 flex items-center justify-center">
                <!-- Renderizado por ChartRegistry -->
            </div>
        </div>

        <!-- 2. DETALLE / TABLA DE MÉTRICAS (OCULTO) -->
        <div id="card-tabla-metricas" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col transition-all">
            <div class="px-6 py-4 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 shrink-0">
                <div>
                    <h2 id="titulo-tabla-detalle" class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">Detalle</h2>
                </div>
            </div>
            <div class="flex-1 overflow-x-auto overflow-y-auto max-h-[500px] custom-scrollbar w-full bg-white">
                <table id="tabla-detalle-metricas" class="w-full text-xs border-collapse table-auto">
                    <thead id="thead-detalle-metricas" class="sticky top-0 z-30 shadow-xs"></thead>
                    <tbody id="tbody-detalle-metricas" class="divide-y divide-slate-100 bg-white"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- TOOLTIP FLOTANTE TABLEAU -->
    <div id="tooltip-tableau-costos"
        class="hidden fixed z-50 pointer-events-none bg-white text-slate-800 text-[11px] rounded-xs shadow-2xl border border-slate-300 p-3 min-w-[260px] max-w-[380px] font-sans transition-opacity duration-75">
    </div>

    <!-- SCRIPTS Y DEPENDENCIAS -->
    <script src="../../core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="../../assets/utils-graficos/periodo-helper.js?v=20260923_01"></script>
    <script src="../../assets/utils-graficos/custom-multiselect.js?v=20260923_01"></script>
    <script src="../../assets/utils-graficos/excel-export-helper.js?v=20260923_01"></script>
    <script src="../../assets/utils-graficos/loading-helper.js"></script>
    <script src="charts/chart.analisis_precios.js?v=20260923_01"></script>
    <script src="charts/chart.analisis_precios_els.js?v=20260923_01"></script>
    <script src="charts/chart.dash_regalo_els.js?v=20260923_03"></script>
    <script src="analisisPrecios.service.js?v=20260923_01"></script>
    <script src="analisisPrecios.controller.js?v=20260923_01"></script>
</body>
