<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - usuarios</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="../../assets/fontawesome/css/all.min.css">


    <link rel="stylesheet" href="../../assets/css/dashboard-styles.css">
    <link rel="stylesheet" href="../../assets/css/dashboard-style.css">
    <link rel="stylesheet" href="../../assets/css/dashboard-responsive.css">
</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-6">

        <!-- Acciones -->
        <section class="bg-white rounded-2xl card-shadow p-4 mb-4 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-tools text-purple-600"></i>
                Acciones
            </h2>
            <div class="flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-3">
                    <button id="btnNuevo"
                        class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale">
                        <i class="fas fa-plus mr-2"></i>
                        Nuevo Registro
                    </button>
                </div>

            </div>
        </section>

        <!-- Tabla -->
        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <h2 class="text-xl font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-table text-purple-600"></i>
                Registros
            </h2>

            <div class="table-scroll">
                <table class="min-w-full" id="dataTableUser">
                    <thead class="bg-gradient-to-r from-blue-600 to-blue-700 text-white sticky top-0">
                        <tr>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">#</th>
                            <th
                                class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider whitespace-nowrap">
                                Codigo
                            </th>
                            <th
                                class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider whitespace-nowrap">
                                Nombre
                            </th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">RUC</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">Estado</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold uppercase tracking-wider">OPCIONES
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="12" class="text-center py-8 text-gray-500">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Modal -->
    <div id="modalUsuario"
        class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4 transition-opacity"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full my-8 transform transition-all">

            <div class="bg-blue-800 p-4 rounded-t-2xl flex justify-between items-center">
                <h3 id="modalUsuarioTitle" class="text-2xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-user-plus"></i> Nuevo Usuario
                </h3>
                <button id="btnCerrarModalUsuario" class="text-white hover:text-gray-200 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6">
                <form id="formUsuario" class="space-y-5">
                    <input type="hidden" id="user_is_edit" name="is_edit" value="false">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Código de Usuario *</label>
                        <div class="relative">
                            <i
                                class="fas fa-id-badge absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="user_codigo" name="codigo" required maxlength="6"
                                placeholder="Ej: U001"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none uppercase">
                        </div>
                        <p class="text-xs text-gray-400 mt-1">Máximo 6 caracteres. Será su ID de acceso.</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo *</label>
                        <div class="relative">
                            <i class="fas fa-user absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="user_nombre" name="nombre" required placeholder="Ej: Juan Pérez"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">RUC *</label>
                        <div class="relative">
                            <i
                                class="fas fa-id-card absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="user_ruc" name="ruc" required placeholder="Ej: 20123456789"
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                        </div>
                    </div>

                    <div id="passwordContainer">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña de Acceso *</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="password" id="user_password" name="password" placeholder="••••••••"
                                class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                            <button type="button" onclick="togglePasswordVisually('user_password', this)"
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                                <i class="fas fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-6">
                        <button type="button" id="btnCancelarUsuario"
                            class="px-6 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-semibold transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" id="btnGuardarUsuario"
                            class="px-6 py-2 text-white bg-purple-600 hover:bg-purple-700 rounded-lg font-semibold shadow transition-colors flex items-center gap-2">
                            <i class="fas fa-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="modalResetPass"
        class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4 transition-opacity"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full my-8 transform transition-all">

            <div class="bg-orange-400 to-pink-600 p-4 rounded-t-2xl flex justify-between items-center">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-key"></i> Nueva Contraseña
                </h3>
                <button id="btnCerrarModalPass" class="text-white hover:text-gray-200 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6">
                <form id="formResetPass" class="space-y-4">
                    <input type="hidden" id="reset_codigo" name="codigo">

                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 mb-4 text-center">
                        <p class="text-xs text-gray-500 uppercase font-semibold">Usuario seleccionado</p>
                        <p id="reset_nombre_display" class="text-sm font-bold text-gray-800">Cargando...</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
                        <div class="relative">
                            <i
                                class="fas fa-unlock-alt absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="password" id="reset_password" name="password" required placeholder="••••••••"
                                class="w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none">
                            <button type="button" onclick="togglePasswordVisually('reset_password', this)"
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none">
                                <i class="fas fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-6">
                        <button type="button" id="btnCancelarPass"
                            class="px-4 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-semibold transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" id="btnGuardarPass"
                            class="px-4 py-2 text-white bg-orange-500 hover:bg-orange-600 rounded-lg font-semibold shadow transition-colors flex items-center gap-2">
                            <i class="fas fa-check"></i> Actualizar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

    <!-- select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../../core/config.js"></script>
    <script src="gestionUsuarios.service.js"></script>
    <script src="gestionUsuarios.Controller.js"></script>

    <script>
        // Pequeña función auxiliar para el ojito de las contraseñas
        function togglePasswordVisually(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>

</body>

</html>
