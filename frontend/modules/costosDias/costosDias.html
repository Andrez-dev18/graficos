<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costos Tradicional Día - Panel Operativo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen m-0 p-0 font-sans">

    <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">
        
        <!-- BARRA SUPERIOR DE CABECERA Y TOGGLE -->
        <div id="cabecera-filtros"
            class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl transition-all">
            <div class="flex items-center gap-3 px-4 py-3 sm:px-5">
                <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Costos Tradicional Día</h1>
                    <p class="text-xs text-slate-500">Monitoreo de validación de costos, detalle familia y subfamilia</p>
                </div>
            </div>

            <!-- BOTÓN TOGGLE DE FILTROS -->
            <div class="flex items-center gap-2 px-3 py-2 sm:px-4">
                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <svg id="icon-toggle-filtros" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DE FILTROS -->
        <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
            <div class="flex flex-wrap items-end gap-3 sm:gap-4">
                
                <!-- 1. PERIODO Y CONTENEDOR DINÁMICO DE FECHAS (PERIODO-HELPER) -->
                <div class="flex flex-wrap items-end gap-3">
                    <div class="flex flex-col">
                        <label for="select-tipo-periodo" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERIODO</label>
                        <select id="select-tipo-periodo"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="entre_fechas">Entre fechas</option>
                            <option value="por_fecha">Por fecha</option>
                            <option value="ultima_semana">Última semana</option>
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses" selected>Entre meses</option>
                        </select>
                    </div>

                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2">
                        <!-- Generado dinámicamente por PeriodoHelper -->
                    </div>
                </div>


                <!-- BOTONES DE ACCIÓN -->
                <div class="flex items-center gap-2 ml-auto sm:ml-0">
                    <button id="btn-cargar" type="button"
                        class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        <span>Cargar</span>
                    </button>
                    <button id="btn-exportar-pdf" type="button"
                        class="flex items-center justify-center gap-2 px-4 py-2 bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-bold text-sm rounded-lg shadow-md shadow-rose-500/20 transition-all cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 13h6M9 17h3">
                            </path>
                        </svg>
                        <span>PDF</span>
                    </button>
                    <button id="btn-limpiar" type="button"
                        class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <span>Limpiar</span>
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- CONTENEDOR PRINCIPAL DE PANELES 1X1 (STACK VERTICAL) -->
    <div id="contenedor-graficos-lista" class="flex flex-col gap-6 mt-6 pb-12">

        <!-- 1. GRAFICA COSTO (LÍNEA MENSUAL DE COSTO UNITARIO) -->
        <div id="card-grafica-costo" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col">
            <div class="px-6 py-4 bg-white border-b border-slate-200 flex items-center justify-between gap-3 shrink-0">
                <div class="flex items-center gap-2.5">
                    <h2 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">GraficaCosto</h2>
                    <span id="badge-anio-grafica" class="text-xs font-mono font-bold text-blue-700 bg-blue-50 border border-blue-200/60 px-2.5 py-0.5 rounded-md">
                        2025
                    </span>
                </div>
                <p class="text-xs text-slate-500 hidden sm:block">Evolución del costo unitario mensual (S/ por unidad)</p>
            </div>

            <div id="contenedor-grafica-costo" class="relative w-full h-[320px] sm:h-[350px] p-4 flex">
                <!-- Se inyectan dinámicamente los subpaneles por año estilo Tableau -->
            </div>
        </div>

        <!-- 2. DETALLE FAMILIA / SUBFAMILIA (MATRIZ JERÁRQUICA CON SCROLL HORIZONTAL) -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col">
            <div class="px-6 py-4 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 shrink-0">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">Detalle Familia/SubFamilia</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Desglose de Costo Unitario (CU) y Variación (Dif) por mes</p>
                </div>
                <div class="flex items-center gap-2 text-xs font-medium text-slate-500">
                    <span class="inline-flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Incremento (+)</span>
                    <span class="inline-flex items-center gap-1 ml-2"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Disminución (-)</span>
                </div>
            </div>

            <div class="flex-1 overflow-x-auto overflow-y-auto max-h-[620px] custom-scrollbar w-full bg-white">
                <table id="tabla-detalle-costos" class="w-full text-xs border-collapse table-auto">
                    <thead id="thead-detalle-costos" class="sticky top-0 z-30 shadow-xs"></thead>
                    <tbody id="tbody-detalle-costos" class="divide-y divide-slate-100 bg-white"></tbody>
                    <tfoot id="tfoot-detalle-costos" class="sticky bottom-0 z-30 bg-blue-50/90 shadow-2xs"></tfoot>
                </table>
            </div>
        </div>

    </div>

    <!-- TOOLTIP FLOTANTE TABLEAU -->
    <div id="tooltip-tableau-costos"
        class="hidden fixed z-50 pointer-events-none bg-white text-slate-800 text-[11px] rounded-xs shadow-2xl border border-slate-300 p-3 min-w-[240px] max-w-[360px] font-sans transition-opacity duration-75">
    </div>

    <!-- SCRIPTS Y DEPENDENCIAS -->
    <script src="../../core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script src="../../assets/utils-graficos/periodo-helper.js"></script>
    <script src="costosDias.service.js?v=20261029_1"></script>
    <script src="costosDias.controller.js?v=20261029_1"></script>
</body>

</html>
