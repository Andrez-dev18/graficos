<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costos Tradicionales - Costo de Producción Pollo Vivo</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen m-0 p-0 font-sans">

    <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">
        
        <!-- BARRA SUPERIOR DE CABECERA Y TOGGLE -->
        <div id="cabecera-filtros"
            class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl transition-all">
            <div class="flex items-center gap-3 px-4 py-3 sm:px-5">
                <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z">
                        </path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Costos Tradicionales</h1>
                    <p class="text-xs text-slate-500">Monitoreo de Costo de Producción y Costo de Alimentación</p>
                </div>
            </div>

            <!-- BOTÓN TOGGLE DE FILTROS -->
            <div class="flex items-center gap-2 px-3 py-2 sm:px-4">
                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <svg id="icon-toggle-filtros" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DE FILTROS -->
        <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
            <div class="flex flex-wrap items-end gap-3 sm:gap-4">
                
                <!-- 1. PERIODO Y CONTENEDOR DINÁMICO DE FECHAS (PERIODO-HELPER) -->
                <div class="flex flex-wrap items-end gap-3">
                    <div class="flex flex-col">
                        <label for="select-tipo-periodo" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERIODO</label>
                        <select id="select-tipo-periodo"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="entre_fechas">Entre fechas</option>
                            <option value="por_fecha">Por fecha</option>
                            <option value="ultima_semana">Última semana</option>
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses" selected>Entre meses</option>
                        </select>
                    </div>

                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2">
                        <!-- Generado dinámicamente por PeriodoHelper -->
                    </div>

                    <!-- SELECT TIPO DE GRÁFICO (SELECCIÓN ÚNICA) -->
                    <div class="flex flex-col">
                        <label for="select-tipo-grafico"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO DE GRÁFICO</label>
                        <select id="select-tipo-grafico"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="CPO1CostoProduccion" selected>CP01 Costo Produccion</option>
                            <option value="CP02 CPVvsCA">CP02 CPVvsCA</option>
                            <option value="CP03 CPPVxZona">CP03 CPPVxZona</option>
                            <option value="CP04 CPPVvsCAxZona">CP04 CPPVvsCAxZona</option>
                            <option value="CP05 CPPVvsCAZonaBarra">CPPVvsCAZonaBarra</option>
                            <option value="CP05 CAABBvsICA">CP05 CAABBvsICA</option>
                            <option value="CP05 MortVsPeso">CP05 MortVsPeso</option>
                            <option value="CP06 CAABB">CP06 CAABB</option>
                            <option value="CP07 InsumosAABB">CP07 InsumosAABB</option>
                            <option value="CP08 TendenciaInsumos">CP08 TendenciaInsumos</option>
                            <option value="CP09 CZonaGranja">CP09 CZonaGranja</option>
                            <option value="CP14 AnalisisCompleto">CP14 AnalisisCompleto</option>
                        </select>
                    </div>

                    <!-- SELECT ZONA (FILTRO PARA CP03, CP04, CP05) -->
                    <div id="contenedor-filtro-zona" class="flex flex-col hidden transition-all">
                        <label for="select-zona"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">ZONA</label>
                        <select id="select-zona"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="TODOS" selected>(Todo)</option>
                            <option value="JOYA">JOYA</option>
                            <option value="MOLLENDO">MOLLENDO</option>
                        </select>
                    </div>

                    <!-- FILTROS EXCLUSIVOS PARA CP14 ANALISIS COMPLETO (CUSTOM-MULTISELECT) -->
                    <!-- 1. FILTRO CLASIFICACIÓN CP14 -->
                    <div id="contenedor-filtro-clasificacion-cp14" class="relative flex flex-col hidden transition-all">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">CLASIFICACIÓN</label>
                        <div class="relative">
                            <button id="btn-dropdown-clasificacion-cp14" type="button"
                                class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer flex items-center justify-between gap-2 min-w-[200px] max-w-[260px]">
                                <span id="label-clasificacion-cp14" class="truncate text-xs font-semibold text-slate-700">Ninguno seleccionado</span>
                                <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <div id="dropdown-clasificacion-cp14"
                                class="custom-multiselect-dropdown hidden absolute left-0 top-full mt-1.5 w-[300px] bg-white border border-slate-200 rounded-xl shadow-2xl z-50 p-2.5 flex flex-col gap-2">
                                <input type="text" id="search-clasificacion-cp14" placeholder="Buscar clasificación..."
                                    class="w-full px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 text-slate-700 font-medium">
                                <div id="container-options-clasificacion-cp14" class="max-h-[200px] overflow-y-auto custom-scrollbar flex flex-col gap-1 pr-1"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. FILTRO GRANJA CP14 -->
                    <div id="contenedor-filtro-granja-cp14" class="relative flex flex-col hidden transition-all">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">GRANJA</label>
                        <div class="relative">
                            <button id="btn-dropdown-granja-cp14" type="button"
                                class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer flex items-center justify-between gap-2 min-w-[170px] max-w-[220px]">
                                <span id="label-granja-cp14" class="truncate text-xs font-semibold text-slate-700">Ninguno seleccionado</span>
                                <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <div id="dropdown-granja-cp14"
                                class="custom-multiselect-dropdown hidden absolute left-0 top-full mt-1.5 w-[260px] bg-white border border-slate-200 rounded-xl shadow-2xl z-50 p-2.5 flex flex-col gap-2">
                                <input type="text" id="search-granja-cp14" placeholder="Buscar granja..."
                                    class="w-full px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 text-slate-700 font-medium">
                                <div id="container-options-granja-cp14" class="max-h-[200px] overflow-y-auto custom-scrollbar flex flex-col gap-1 pr-1"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. FILTRO GALPÓN CP14 -->
                    <div id="contenedor-filtro-galpon-cp14" class="relative flex flex-col hidden transition-all">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">GALPÓN</label>
                        <div class="relative">
                            <button id="btn-dropdown-galpon-cp14" type="button"
                                class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer flex items-center justify-between gap-2 min-w-[140px] max-w-[180px]">
                                <span id="label-galpon-cp14" class="truncate text-xs font-semibold text-slate-700">Ninguno seleccionado</span>
                                <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <div id="dropdown-galpon-cp14"
                                class="custom-multiselect-dropdown hidden absolute left-0 top-full mt-1.5 w-[190px] bg-white border border-slate-200 rounded-xl shadow-2xl z-50 p-2.5 flex flex-col gap-2">
                                <input type="text" id="search-galpon-cp14" placeholder="Buscar galpón..."
                                    class="w-full px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 text-slate-700 font-medium">
                                <div id="container-options-galpon-cp14" class="max-h-[200px] overflow-y-auto custom-scrollbar flex flex-col gap-1 pr-1"></div>
                            </div>
                        </div>
                    </div>

                    <!-- SELECT MULTI-CHECKBOX ITEM / INSUMOS (FILTRO PARA CP07) -->
                    <div id="contenedor-filtro-item" class="relative flex flex-col hidden transition-all">
                        <label for="btn-dropdown-items"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">ITEM (INSUMOS)</label>
                        <div class="relative">
                            <button id="btn-dropdown-items" type="button"
                                class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer flex items-center justify-between gap-2 min-w-[220px] max-w-[300px]">
                                <span id="label-items-seleccionados" class="truncate text-xs font-semibold text-slate-700">(Todo)</span>
                                <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>

                            <!-- DROPDOWN PANEL -->
                            <div id="panel-dropdown-items"
                                class="hidden absolute left-0 top-full mt-1.5 w-[330px] bg-white border border-slate-200 rounded-xl shadow-2xl z-50 p-2.5 flex flex-col gap-2">
                                <!-- BUSCADOR -->
                                <div class="relative">
                                    <input type="text" id="input-buscar-item"
                                        placeholder="Buscar insumo por código o nombre..."
                                        class="w-full pl-8 pr-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 focus:bg-white transition-all text-slate-700 font-medium">
                                    <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </div>

                                <!-- ACCIONES RÁPIDAS -->
                                <div class="flex items-center justify-between px-1 text-[11px] border-b border-slate-100 pb-1.5 text-slate-500">
                                    <label class="flex items-center gap-1.5 cursor-pointer font-semibold hover:text-blue-600 select-none">
                                        <input type="checkbox" id="chk-item-todo" class="w-3.5 h-3.5 rounded text-blue-600 focus:ring-0 cursor-pointer" checked>
                                        <span>(Todo)</span>
                                    </label>
                                    <span id="badge-contador-items" class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded-full font-medium">
                                        Todos
                                    </span>
                                </div>

                                <!-- LISTA SCROLLABLE DE ITEMS -->
                                <div id="lista-checkboxes-items"
                                    class="max-h-[220px] overflow-y-auto custom-scrollbar flex flex-col gap-1 pr-1">
                                    <!-- Generado dinámicamente -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- BOTONES DE ACCIÓN -->
                <div class="flex items-center gap-2 ml-auto sm:ml-0">
                    <button id="btn-cargar" type="button"
                        class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        <span>Cargar</span>
                    </button>
                    <button id="btn-limpiar" type="button"
                        class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <span>Limpiar</span>
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- CONTENEDOR PRINCIPAL DE PANELES 1X1 (STACK VERTICAL) -->
    <div id="contenedor-graficos-lista" class="flex flex-col gap-6 mt-6 pb-12">

        <!-- 1. GRAFICA PRINCIPAL (CP01, CP02, CP03 O CP04 SEGÚN SELECT) -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col">
            <div class="px-6 py-4 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 shrink-0">
                <div class="flex items-center gap-2.5">
                    <h2 id="titulo-grafica-principal" class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">
                        Costo de Producción Pollo Vivo - MES
                    </h2>
                </div>
                <div id="contenedor-badges-grafica" class="flex items-center gap-3 text-xs font-medium">
                    <!-- Inyectado dinámicamente según CP01, CP02, CP03, CP04 -->
                </div>
            </div>

            <div id="contenedor-grafica-costo" class="relative w-full h-[400px] p-4">
                <canvas id="chart-costo-produccion" style="image-rendering: -webkit-optimize-contrast;"></canvas>
            </div>
        </div>

        <!-- 2. DETALLE COSTO DE PRODUCCIÓN (TABLA DE INDICADORES MATRICIAL PARA CP01 / DETALLE CENCOS PARA CP04) -->
        <div id="card-tabla-metricas" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col transition-all">
            <div class="px-6 py-4 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 shrink-0">
                <div>
                    <h2 id="titulo-tabla-detalle" class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">Detalle Costo de Producción Pollo Vivo - MES</h2>
                    <p id="subtitulo-tabla-detalle" class="text-xs text-slate-500 mt-0.5">Histórico de indicadores productivos y de rendimiento por mes</p>
                </div>
            </div>

            <div class="flex-1 overflow-x-auto overflow-y-auto max-h-[500px] custom-scrollbar w-full bg-white">
                <table id="tabla-detalle-metricas" class="w-full text-xs border-collapse table-auto">
                    <thead id="thead-detalle-metricas" class="sticky top-0 z-30 shadow-xs"></thead>
                    <tbody id="tbody-detalle-metricas" class="divide-y divide-slate-100 bg-white"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- TOOLTIP FLOTANTE TABLEAU -->
    <div id="tooltip-tableau-costos"
        class="hidden fixed z-50 pointer-events-none bg-white text-slate-800 text-[11px] rounded-xs shadow-2xl border border-slate-300 p-3 min-w-[240px] max-w-[360px] font-sans transition-opacity duration-75">
    </div>

    <!-- SCRIPTS Y DEPENDENCIAS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <script src="../../assets/utils-graficos/periodo-helper.js"></script>
    <script src="../../assets/utils-graficos/custom-multiselect.js"></script>
    <script src="charts/chart.cp05_caabb_vs_ica.js?v=20260913_2"></script>
    <script src="charts/chart.cp06_caabb.js?v=20260913_2"></script>
    <script src="charts/chart.cp09_c_zona_granja.js?v=20260913_5"></script>
    <script src="charts/chart.cp14_analisis_completo.js?v=20260914_2"></script>
    <script src="costosTradicionales.service.js?v=20260914_2"></script>
    <script src="costosTradicionales.controller.js?v=20260914_2"></script>
</body>

</html>
