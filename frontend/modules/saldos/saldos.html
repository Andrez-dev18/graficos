<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graficos saldos</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        /* Scrollbars delgadas y estilizadas */
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            /* Ancho del scroll vertical */
            height: 6px;
            /* Altura del scroll horizontal */
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>

</head>

<body class="bg-gray-100 h-screen m-0 p-0">


    <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">

        <!-- BARRA SUPERIOR DE TABS ALINEADA AL BORDE EXTERIOR -->
        <div id="cabecera-filtros"
            class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl transition-all">
            <!-- TABS INTEGRADOS AL RAS DEL BORDE SUPERIOR E IZQUIERDO -->
            <div class="flex items-center gap-3 px-4 py-3 sm:px-5">
                <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                        </path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Filtros dinámicos</h1>
                    <p class="text-xs text-slate-500">Filtre por rango de fechas, tipo de gráfico, cuenta venta y nombre
                        de cliente.
                    </p>
                </div>
            </div>

            <!-- BOTÓN TOGGLE PLEGAR / DESPLEGAR -->
            <div class="px-3 py-2 sm:px-4">
                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <svg id="icon-toggle-filtros" class="w-4 h-4 transition-transform duration-300" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DE FILTROS -->
        <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
            <div class="flex flex-wrap items-end gap-3 sm:gap-4">

                <!-- 1. FILTRO PERÍODO Y CONTENEDOR DINÁMICO DE FECHAS -->
                <div class="flex flex-wrap items-end gap-3">
                    <!-- Selector de Período -->
                    <div class="flex flex-col">
                        <label for="select-tipo-periodo"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERIODO</label>
                        <select id="select-tipo-periodo"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses">Entre meses</option>
                            <option value="por_fecha">Por fecha</option>
                            <option value="entre_fechas" selected>Entre fechas</option>
                            <option value="ultima_semana">Última Semana</option>
                            <option value="entre_semanas">Entre semanas</option>
                        </select>
                    </div>

                    <!-- Contenedor generado por JS según el periodo -->
                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2">
                        <!-- Generado dinámicamente -->
                    </div>
                </div>

                <!-- 2. SELECT TIPO DE GRÁFICO (SELECCIÓN ÚNICA) -->
                <div class="flex flex-col">
                    <label for="select-tipo-grafico"
                        class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO DE
                        GRÁFICO</label>
                    <select id="select-tipo-grafico"
                        class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                        <option value="saltosXcobrarXbarra" selected>saltosXcobrarXbarra</option>
                        <option value="02SalxCobrarxZona">02SalxCobrarxZona</option>
                        <option value="08IndAnticipos">08IndAnticipos</option>
                        <option value="20DashAnalisisCtasMaxDeudoresDocs">20DashAnalisisCtasMaxDeudoresDocs</option>
                    </select>
                </div>

                <!-- 3. MULTI-SELECT CUENTA VENTA -->
                <div class="flex flex-col relative">
                    <label
                        class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">CUENTAVENTA</label>
                    <button id="ms-cuentaventa-btn" type="button"
                        class="w-full sm:w-auto min-w-[170px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                        <span id="ms-cuentaventa-label" class="truncate">Todos seleccionados</span>
                        <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>
                    <div id="ms-cuentaventa-dropdown"
                        class="custom-multiselect-dropdown absolute left-0 top-full z-50 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                        <div class="relative mb-2">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                            <input type="text" id="ms-cuentaventa-search" placeholder="Buscar cuenta venta..."
                                class="w-full pl-9 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800">
                        </div>
                        <div id="ms-cuentaventa-options" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>
                    </div>
                </div>

                <!-- 4. MULTI-SELECT NOMCLIENTE (Barras) -->
                <div id="wrapper-filtro-nomcliente" class="flex flex-col relative">
                    <label
                        class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">NOMCLIENTE</label>
                    <button id="ms-nomcliente-btn" type="button"
                        class="w-full sm:w-auto min-w-[220px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                        <span id="ms-nomcliente-label" class="truncate font-semibold text-slate-800">Todos
                            seleccionados</span>
                        <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>
                    <div id="ms-nomcliente-dropdown"
                        class="custom-multiselect-dropdown absolute left-0 top-full z-50 mt-1.5 w-80 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                        <div class="relative mb-2">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                            <input type="text" id="ms-nomcliente-search" placeholder="Buscar cliente..."
                                class="w-full pl-9 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800">
                        </div>
                        <div id="ms-nomcliente-options" class="max-h-60 overflow-y-auto space-y-0.5 pr-1"></div>
                    </div>
                </div>

                <!-- 4.1 MULTI-SELECT VENCIMIENTO (Líneas) -->
                <div id="wrapper-filtro-vencimiento" class="hidden flex-col relative">
                    <label
                        class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">VENCIMIENTO</label>
                    <button id="ms-vencimiento-btn" type="button"
                        class="w-full sm:w-auto min-w-[170px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                        <span id="ms-vencimiento-label" class="truncate font-semibold text-slate-800">VENCIDO</span>
                        <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>
                    <div id="ms-vencimiento-dropdown"
                        class="custom-multiselect-dropdown absolute left-0 top-full z-50 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                        <input type="text" id="ms-vencimiento-search" placeholder="Buscar vencimiento..."
                            class="w-full pl-3 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800 mb-2">
                        <div id="ms-vencimiento-options" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>
                    </div>
                </div>

                <!-- 4.2 MULTI-SELECT DECISIÓN (Líneas) -->
                <div id="wrapper-filtro-decision" class="hidden flex-col relative">
                    <label
                        class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">DECISIÓN</label>
                    <button id="ms-decision-btn" type="button"
                        class="w-full sm:w-auto min-w-[170px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                        <span id="ms-decision-label" class="truncate font-semibold text-slate-800">Todos
                            seleccionados</span>
                        <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>
                    <div id="ms-decision-dropdown"
                        class="custom-multiselect-dropdown absolute left-0 top-full z-50 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                        <input type="text" id="ms-decision-search" placeholder="Buscar decisión..."
                            class="w-full pl-3 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800 mb-2">
                        <div id="ms-decision-options" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>
                    </div>
                </div>

                <!-- 4.3 MULTI-SELECT OBSERVACIÓN (Líneas) -->
                <div id="wrapper-filtro-observacion" class="hidden flex-col relative">
                    <label
                        class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">OBSERVACIÓN</label>
                    <button id="ms-observacion-btn" type="button"
                        class="w-full sm:w-auto min-w-[170px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                        <span id="ms-observacion-label" class="truncate font-semibold text-slate-800">Todos
                            seleccionados</span>
                        <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                            </path>
                        </svg>
                    </button>
                    <div id="ms-observacion-dropdown"
                        class="custom-multiselect-dropdown absolute left-0 top-full z-50 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                        <input type="text" id="ms-observacion-search" placeholder="Buscar observación..."
                            class="w-full pl-3 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800 mb-2">
                        <div id="ms-observacion-options" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>
                    </div>
                </div>

                <!-- 5. DISPOSICIÓN DE PANELES (VERTICAL / HORIZONTAL) -->
                <div class="flex flex-col">
                    <label for="select-disposicion-graficos"
                        class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">DISPOSICIÓN</label>
                    <div class="relative inline-flex items-center">
                        <div id="icono-disposicion-activa"
                            class="absolute left-2.5 pointer-events-none text-slate-600 flex items-center">
                            <svg id="icon-disp-vertical" class="w-4 h-4" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                            <svg id="icon-disp-horizontal" class="w-4 h-4 hidden" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 4v16M15 4v16M4 4h16M4 20h16"></path>
                            </svg>
                        </div>
                        <select id="select-disposicion-graficos"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg pl-8 pr-8 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer appearance-none">
                            <option value="vertical" selected>Vertical</option>
                            <option value="horizontal">Horizontal</option>
                        </select>
                        <div class="absolute right-2.5 pointer-events-none text-slate-400 flex items-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- BOTONES DE ACCIÓN -->
                <div class="flex items-center gap-2 ml-auto sm:ml-0">
                    <button id="btn-cargar" type="button"
                        class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        <span>Cargar</span>
                    </button>
                    <button id="btn-limpiar" type="button"
                        class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <span>Limpiar</span>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- CONTENEDOR DINÁMICO DE GRÁFICOS (TARJETAS INDEPENDIENTES) -->
    <div id="contenedor-graficos-lista" class="flex flex-col gap-6 mt-6 pb-10">
        <!-- Generado dinámicamente por app.js -->
    </div>

    <!-- POPUP MENÚ FLOTANTE AL HACER CLIC EN UNA BARRA (ESTILO TABLEAU) -->
    <div id="popup-menu-barra"
        class="hidden fixed z-50 bg-white border border-slate-200/90 rounded-xl shadow-xl p-2 min-w-[150px] transition-all">
        <button id="btn-abrir-ver-datos" type="button"
            class="w-full flex items-center gap-2 px-3 py-2 text-xs font-semibold text-slate-700 hover:text-blue-600 hover:bg-blue-50/80 rounded-lg transition-colors cursor-pointer text-left">
            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                </path>
            </svg>
            <span>Ver datos</span>
        </button>
    </div>

    <!-- MODAL "VER DATOS" DE TABLEAU -->
    <div id="modal-ver-datos"
        class="hidden fixed inset-0 z-50 overflow-hidden bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
        <div
            class="bg-white w-full max-w-[130vh] max-h-[90vh] rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden animate-in fade-in duration-200">

            <!-- HEADER DEL MODAL -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50/50">
                <div class="flex items-center gap-3">
                    <div class="p-2 bg-blue-100/80 text-blue-600 rounded-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-slate-800" id="modal-titulo-vista">Ver datos: Saldos por
                            Cobrar</h3>
                        <p class="text-xs text-slate-500" id="modal-subtitulo-filas">Cargando información...</p>
                    </div>
                </div>
                <button id="btn-cerrar-modal" type="button"
                    class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-colors cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <!-- CUERPO CON PESTAÑAS (SIDEBAR IZQUIERDO Y TABLA DERECHA) -->
            <div class="flex flex-1 overflow-hidden">
                <!-- SIDEBAR DE TABS -->
                <div class="w-48 bg-slate-50 border-r border-slate-100 p-3 flex flex-col justify-between">
                    <div class="space-y-1">
                        <button id="tab-btn-resumen" type="button"
                            class="w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded-lg bg-blue-50 text-blue-700 border border-blue-200/60 transition-all text-left cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                                </path>
                            </svg>
                            <span>Resumen</span>
                        </button>
                        <button id="tab-btn-completos" type="button"
                            class="w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all text-left cursor-pointer">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                            </svg>
                            <span>Datos completos</span>
                        </button>

                        <!-- SEPARADOR Y BOTÓN EXPORTAR EXCEL -->
                        <div class="pt-2">
                            <div class="border-t border-slate-200/80 mb-2"></div>
                            <button id="btn-exportar-excel-modal" type="button"
                                class="w-full flex items-center gap-2.5 px-3 py-2 text-xs font-semibold rounded-lg text-emerald-700 bg-emerald-50/80 hover:bg-emerald-100 border border-emerald-200/70 transition-all text-left cursor-pointer group shadow-2xs">
                                <svg class="w-4 h-4 text-emerald-600 group-hover:scale-110 transition-transform"
