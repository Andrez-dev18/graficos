<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Jabas</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .jabas-col-1 {
            width: 64px;
            min-width: 64px;
            max-width: 64px;
            position: sticky;
            left: 0;
            z-index: 20;
            background: #ffffff;
        }

        .jabas-col-2 {
            width: 180px;
            min-width: 180px;
            max-width: 180px;
            position: sticky;
            left: 64px;
            z-index: 20;
            background: #ffffff;
        }

        .jabas-col-3 {
            width: 110px;
            min-width: 110px;
            max-width: 110px;
            position: sticky;
            left: 244px;
            z-index: 20;
            background: #ffffff;
        }

        thead .jabas-col-1,
        thead .jabas-col-2,
        thead .jabas-col-3 {
            z-index: 40;
        }

        .pro-col-1 {
            width: 64px;
            min-width: 64px;
            max-width: 64px;
            position: sticky;
            left: 0;
            z-index: 20;
            background: #ffffff;
        }

        .pro-col-2 {
            width: 248px;
            min-width: 248px;
            max-width: 248px;
            position: sticky;
            left: 64px;
            z-index: 20;
            background: #ffffff;
        }

        .pro-col-3 {
            width: 110px;
            min-width: 110px;
            max-width: 110px;
            position: sticky;
            left: 312px;
            z-index: 20;
            background: #ffffff;
        }

        thead .pro-col-1,
        thead .pro-col-2,
        thead .pro-col-3 {
            z-index: 40;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen m-0 p-0 font-sans text-slate-800">
    <div id="loader-inicial-pagina"
        class="fixed inset-0 z-50 bg-slate-50/90 backdrop-blur-xs flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="flex flex-col items-center gap-4 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-200/90 text-center max-w-xs mx-4">
            <div class="relative flex items-center justify-center">
                <div class="w-12 h-12 rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-blue-600">
                    <i class="fa-solid fa-boxes-stacked text-base"></i>
                </div>
            </div>
            <div>
                <h3 class="text-sm font-bold text-slate-800">Cargando Control de Jabas</h3>
                <p class="text-xs text-slate-500 mt-1">Obteniendo configuración y stock...</p>
            </div>
        </div>
    </div>

    <main class="w-full">
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80">
            <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-5">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                        <i class="fa-solid fa-boxes-stacked text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Control de Jabas</h1>
                        <p class="text-xs text-slate-500">Stock contable y evolución diaria por cliente e ítem</p>
                    </div>
                </div>

                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <svg id="icon-toggle-filtros" class="w-4 h-4 transition-transform duration-300" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </button>
            </div>

            <div id="contenedor-filtros-contenido" class="px-4 pb-4 sm:px-5 border-t border-slate-100">
                <div class="flex flex-wrap items-end gap-3 pt-3">
                    <div class="flex flex-col">
                        <label for="select-tipo-grafico"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO DE GRÁFICO</label>
                        <select id="select-tipo-grafico"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[170px]">
                            <option value="DashJabasCont" selected>DashJabasCont</option>
                            <option value="DashJabasPro">DashJabasPro</option>
                            <option value="KardexClienteCont">KardexClienteCont</option>
                            <option value="KardexClientePro">KardexClientePro</option>
                            <option value="StockProvincias">StockProvincias</option>
                            <option value="GraficoIndicadores">GraficoIndicadores</option>
                        </select>
                    </div>

                    <div id="wrapper-filtro-periodo" class="flex flex-col">
                        <label for="select-tipo-periodo"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERÍODO</label>
                        <select id="select-tipo-periodo"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[170px]">
                            <option value="por_fecha">Por fecha</option>
                            <option value="entre_fechas">Entre fechas</option>
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses" selected>Entre meses</option>
                            <option value="ultima_semana">Última semana</option>
                            <option value="entre_semanas">Entre semanas</option>
                        </select>
                    </div>

                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2"></div>

                    <div class="relative flex flex-col">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">ALMACÉN</label>
                        <button id="btn-dropdown-almacen" type="button"
                            class="flex items-center justify-between gap-2 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[170px]">
                            <span id="label-almacen" class="truncate text-left select-none">JAB</span>
                            <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="dropdown-almacen"
                            class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-56 bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2 flex flex-col gap-2">
                            <input id="search-almacen" type="text" placeholder="Buscar almacén..."
                                class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 font-normal">
                            <div id="container-options-almacen"
                                class="max-h-52 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs"></div>
                        </div>
                    </div>

                    <div id="wrapper-filtro-tipocliente" class="relative flex flex-col hidden">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO DE CLIENTE</label>
                        <div id="searchable-filtro-tipocliente"></div>
                    </div>

                    <div id="wrapper-filtro-cliente" class="relative flex flex-col hidden">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">CLIENTE</label>
                        <div id="searchable-filtro-cliente"></div>
                    </div>

                    <div class="flex items-center gap-2 ml-auto">
                        <button id="btn-cargar" type="button"
                            class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                            <i class="fa-solid fa-rotate"></i>
                            <span>Cargar</span>
                        </button>
                        <button id="btn-limpiar" type="button"
                            class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                            <span>Limpiar</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <div id="chip-filtro-activo"
            class="hidden mt-3 flex flex-wrap items-center justify-between gap-2 bg-blue-50 border border-blue-200 text-blue-800 rounded-xl px-3.5 py-2.5">
            <div class="flex items-center gap-2 text-xs">
                <i class="fa-solid fa-filter text-blue-500"></i>
                <span class="font-semibold">Filtro activo:</span>
                <span id="chip-filtro-texto" class="font-medium"></span>
            </div>
            <button id="btn-quitar-filtro" type="button"
                class="flex items-center gap-1.5 text-[11px] font-bold text-blue-700 hover:text-blue-900 bg-white/70 hover:bg-white border border-blue-200 px-2.5 py-1 rounded-md transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark"></i>
                Quitar filtro
            </button>
        </div>

        <div id="mensaje-error"
            class="hidden mt-3 bg-red-50 border border-red-200 text-red-700 text-sm font-medium rounded-xl px-4 py-3"></div>

        <div id="contenedor-graficos-lista" class="mt-6 pb-10"></div>

        <div id="jabas-tooltip"
            class="hidden fixed z-[100] pointer-events-none bg-white text-slate-800 text-[11px] rounded-sm shadow-2xl border border-slate-300 p-3 min-w-[240px] max-w-[360px] font-sans">
        </div>
    </main>

    <script src="../../core/config.js"></script>
    <script src="../../assets/utils-graficos/periodo-helper.js?v=20260918_3"></script>
    <script src="../../assets/utils-graficos/custom-multiselect.js?v=20260918_3"></script>
    <script src="../../assets/utils-graficos/searchable-select.js?v=20261026_1"></script>
    <script src="../../assets/utils-graficos/loading-helper.js?v=20261117_2"></script>
    <script src="charts/chart.dash_jabas_cont.js?v=20261118_1"></script>
    <script src="charts/chart.dash_jabas_pro.js?v=20261118_2"></script>
    <script src="charts/chart.kardex_cliente_cont.js?v=20261118_6"></script>
    <script src="charts/chart.kardex_cliente_pro.js?v=20261118_2"></script>
    <script src="charts/chart.stock_provincias.js?v=20261118_6"></script>
    <script src="charts/chart.grafico_indicadores.js?v=20261118_5"></script>
    <script src="controlJabas.service.js?v=20261118_7"></script>
    <script src="controlJabas.controller.js?v=20261118_11"></script>
</body>

</html>
