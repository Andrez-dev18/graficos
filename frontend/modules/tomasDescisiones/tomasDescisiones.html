<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomas de Decisiones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar { width: 9px; height: 9px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .dash-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
        .dash-table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
        .dash-table th, .dash-table td { border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; }
        .dash-table thead th { background: #2563eb; color: #fff; }
        .dash-table .col-fija { position: sticky; background: #fff; z-index: 20; }
        .dash-table thead .col-fija { background: #2563eb; z-index: 50; }
        .dash-table .col-fija-sombra { box-shadow: 2px 0 3px rgba(15, 23, 42, .06); }
        .dash-table tbody tr:hover td { background-color: #f8fafc; }
        .dash-table tbody tr:hover td.col-fija { background-color: #f8fafc; }

        /* Alineación vertical entre Proyección Diaria e Indicadores Semanales */
        .dash-align thead tr,
        .dash-align thead th { height: 44px; }
        .dash-align thead th {
            vertical-align: middle;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            line-height: 1.15;
        }
        .dash-align tbody tr,
        .dash-align tbody td { height: 32px; }
        .dash-align tbody td { padding-top: 0; padding-bottom: 0; vertical-align: middle; }
        .dash-align tbody tr.dash-dia-inicio td { border-top: 2px solid #cbd5e1; }
        .dash-align tfoot tr,
        .dash-align tfoot td { height: 32px; }
        .dash-align tfoot td {
            padding-top: 0;
            padding-bottom: 0;
            vertical-align: middle;
            position: sticky;
            bottom: 0;
            z-index: 40;
            background: #f8fafc;
            border-top: 1px solid #cbd5e1;
        }
        .dash-align.dash-fixed { table-layout: fixed; }
        .dash-align tfoot td.col-fija { z-index: 60; }
        .dash-align tfoot td.variacion-pos { background: #ecfdf5; }
        .dash-align tfoot td.variacion-neg { background: #fff1f2; }
        .dash-align tfoot td.variacion-cero { background: #f8fafc; }
        .dash-align .dash-indicador {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 20px;
            line-height: 20px;
            padding-top: 0;
            padding-bottom: 0;
            font-size: 10px;
            font-weight: 700;
        }
        .variacion-pos { background: #ecfdf5; color: #047857; font-weight: 700; }
        .variacion-neg { background: #fff1f2; color: #be123c; font-weight: 700; }
        .variacion-cero { background: #f8fafc; color: #64748b; }
        .indicador-pos { background: #059669; color: #fff; }
        .indicador-neg { background: #e11d48; color: #fff; }
        .indicador-cero { background: #cbd5e1; color: #334155; }
        .dash-input { background: #fff; border: 1px solid #cbd5e1; border-radius: .5rem; padding: .5rem .75rem; font-size: .8rem; font-weight: 600; color: #0f172a; }
        .dash-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, .12); }

        #contenedor-filtros label { font-size: 11px; }
        #contenedor-filtros .dash-input { font-size: .9rem; }
        #contenedor-filtros .custom-multiselect-dropdown { font-size: .85rem; }
    </style>
</head>
<body class="bg-gray-100 h-screen m-0 p-0">
        <div class="w-full dash-card p-4 sm:p-5">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-4">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                        <i class="fa-solid fa-chart-line text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-slate-900 leading-tight">Tomas de Decisiones</h1>
                        <p class="text-xs text-slate-500">Proyección de ventas e indicadores por semana.</p>
                    </div>
                </div>
                <button id="btn-toggle-filtros" type="button" class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded-lg border border-slate-200">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <i id="icon-toggle-filtros" class="fa-solid fa-chevron-up transition-transform duration-300"></i>
                </button>
            </div>

            <div id="contenedor-filtros" class="pt-4">
                <div class="flex flex-wrap items-end gap-3">
                    <div class="flex flex-col">
                        <label for="select-tipo-grafico" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">TIPO GRÁFICO</label>
                        <select id="select-tipo-grafico" class="dash-input min-w-[260px]">
                            <option value="DashProyectadoVentasIndicador" selected>DashProyectadoVentasIndicador</option>
                            <option value="DashTasasdeInteres">DashTasasdeInteres</option>
                            <option value="GraficasProyectadosVSReal">GraficasProyectadosVSReal</option>
                            <option value="GraficasProyectadosDias">GraficasProyectadosDias</option>
                        </select>
                    </div>

                    <div id="filtro-anio" class="flex flex-col hidden">
                        <label for="select-anio" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">AÑO</label>
                        <select id="select-anio" class="dash-input min-w-[130px]"></select>
                    </div>

                    <div id="filtro-periodo" class="flex flex-col">
                        <label for="select-tipo-periodo" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">PERIODO</label>
                        <select id="select-tipo-periodo" class="dash-input min-w-[150px]">
                            <option value="entre_fechas" selected>Entre fechas</option>
                            <option value="por_fecha">Por fecha</option>
                            <option value="ultima_semana">Última semana</option>
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses">Entre meses</option>
                        </select>
                    </div>

                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2"></div>

                    <div id="filtro-semana" class="flex flex-col relative">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">SEMANA</label>
                        <button id="ms-semana-btn" type="button" class="dash-input flex items-center justify-between gap-3 min-w-[180px]">
                            <span id="ms-semana-label" class="truncate">Cargando...</span>
                            <i class="fa-solid fa-chevron-down text-slate-400 text-[10px]"></i>
                        </button>
                        <div id="ms-semana-dropdown" class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-72 max-w-[90vw] bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2">
                            <input id="ms-semana-search" type="text" placeholder="Buscar semana..." class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg mb-2">
                            <div id="ms-semana-options" class="max-h-64 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs"></div>
                        </div>
                    </div>

                    <div id="filtro-proceso" class="flex flex-col relative hidden">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">PROCESO</label>
                        <button id="ms-proceso-btn" type="button" class="dash-input flex items-center justify-between gap-3 min-w-[190px]">
                            <span id="ms-proceso-label" class="truncate">Cargando...</span>
                            <i class="fa-solid fa-chevron-down text-slate-400 text-[10px]"></i>
                        </button>
                        <div id="ms-proceso-dropdown" class="custom-multiselect-dropdown hidden absolute top-full left-0 mt-1 w-72 max-w-[90vw] bg-white rounded-xl shadow-xl border border-slate-200 z-50 p-2">
                            <input id="ms-proceso-search" type="text" placeholder="Buscar proceso..." class="w-full text-xs px-2.5 py-1.5 border border-slate-200 rounded-lg mb-2">
                            <div id="ms-proceso-options" class="max-h-64 overflow-y-auto custom-scrollbar flex flex-col gap-1 text-xs"></div>
                        </div>
                    </div>

                    <div id="acciones-filtros" class="flex items-center gap-2">
                        <button id="btn-cargar" type="button" class="flex items-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-lg">
                            <i class="fa-solid fa-rotate"></i><span>Cargar</span>
                        </button>
                        <button id="btn-limpiar" type="button" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200">
                            Limpiar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="contenedor-dashboard" class="mt-4 pb-10"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="../../core/config.js"></script>
    <script src="../../assets/utils-graficos/periodo-helper.js?v=20261028_1"></script>
    <script src="../../assets/utils-graficos/custom-multiselect.js?v=20261028_1"></script>
    <script src="../../assets/utils-graficos/loading-helper.js?v=20261028_1"></script>
    <script src="tomasDescisiones.service.js?v=20261028_4"></script>
    <script src="charts/dashProyectadoVentasIndicador.js?v=20261030_3"></script>
    <script src="charts/dashTasasdeInteres.js?v=20261028_2"></script>
    <script src="charts/dashGraficasProyectadosVSReal.js?v=20261028_5"></script>
    <script src="charts/dashGraficasProyectadosDias.js?v=20261028_7"></script>
    <script src="tomasDescisiones.controller.js?v=20261028_7"></script>
</body>
</html>
