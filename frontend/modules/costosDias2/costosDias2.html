<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costos Tradicional Día 2 - Por Galpón</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen m-0 p-0 font-sans">

    <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">
        
        <!-- BARRA SUPERIOR DE CABECERA Y TOGGLE -->
        <div id="cabecera-filtros"
            class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl transition-all">
            <div class="flex items-center gap-3 px-4 py-3 sm:px-5">
                <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                        </path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Costos Tradicional Día 2</h1>
                    <p class="text-xs text-slate-500">Matriz horizontal de costos, valor y peso GLP desglosado por galpón</p>
                </div>
            </div>

            <!-- BOTÓN TOGGLE DE FILTROS -->
            <div class="flex items-center gap-2 px-3 py-2 sm:px-4">
                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <svg id="icon-toggle-filtros" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DE FILTROS -->
        <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
            <div class="flex flex-wrap items-end gap-3 sm:gap-4">
                
                <!-- 1. PERIODO NORMAL (PERIODO-HELPER) -->
                <div class="flex flex-wrap items-end gap-3">
                    <div class="flex flex-col">
                        <label for="select-tipo-periodo" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERIODO</label>
                        <select id="select-tipo-periodo"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="entre_fechas">Entre fechas</option>
                            <option value="por_fecha">Por fecha</option>
                            <option value="ultima_semana">Última semana</option>
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses" selected>Entre meses</option>
                        </select>
                    </div>

                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2">
                        <!-- Generado dinámicamente por PeriodoHelper -->
                    </div>
                </div>

                <!-- 2. FECHA DE LIQUIDACIÓN -->
                <div class="flex flex-wrap items-end gap-2">
                    <div class="flex flex-col">
                        <label for="input-fecha-liq-ini" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">F. LIQ. INICIO</label>
                        <input id="input-fecha-liq-ini" type="date"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    </div>
                    <div class="flex flex-col">
                        <label for="input-fecha-liq-fin" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">F. LIQ. FIN</label>
                        <input id="input-fecha-liq-fin" type="date"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    </div>
                </div>

                <!-- 3. SELECT GRANJA -->
                <div class="flex flex-col min-w-[170px]">
                    <label for="select-granja" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">GRANJA</label>
                    <select id="select-granja"
                        class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                        <option value="">(Todas las granjas)</option>
                    </select>
                </div>

                <!-- 4. SELECT CAMPAÑA -->
                <div class="flex flex-col min-w-[150px]">
                    <label for="select-campana" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">GRANJA CAMPAÑA</label>
                    <select id="select-campana"
                        class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                        <option value="">(Todas las campañas)</option>
                    </select>
                </div>

                <!-- 5. SELECT GALPÓN -->
                <div class="flex flex-col min-w-[120px]">
                    <label for="select-galpon" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">GALPÓN</label>
                    <select id="select-galpon"
                        class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                        <option value="">(Todos los galpones)</option>
                    </select>
                </div>

                <!-- BOTONES DE ACCIÓN -->
                <div class="flex items-center gap-2 ml-auto sm:ml-0">
                    <button id="btn-cargar" type="button"
                        class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        <span>Cargar</span>
                    </button>
                    <button id="btn-limpiar" type="button"
                        class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <span>Limpiar</span>
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- CONTENEDOR PRINCIPAL DEL LIENZO / MATRIZ HORIZONTAL -->
    <div id="contenedor-graficos-lista" class="flex flex-col gap-6 mt-6 pb-12">

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col">
            <div class="px-6 py-4 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 shrink-0">
                <div>
                    <h2 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">Detalle Familia/SubFamilia por Galpón</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Matriz de Valor, Peso GLP y Costo Unitario (CU GLP) horizontal</p>
                </div>
                <div class="flex items-center gap-2 text-xs font-medium text-slate-500">
                    <span class="inline-flex items-center gap-1.5 bg-blue-50 text-blue-700 font-semibold px-2.5 py-1 rounded-md border border-blue-200/60">
                        <i class="fa-solid fa-table-cells"></i> Vista Horizontal Galpones
                    </span>
                </div>
            </div>

            <!-- TABLA MATRICIAL RESPONSIVA CON SCROLL -->
            <div class="flex-1 overflow-x-auto overflow-y-auto max-h-[640px] custom-scrollbar w-full bg-white">
                <table id="tabla-detalle-costos2" class="w-full text-xs border-collapse table-auto">
                    <thead id="thead-detalle-costos2" class="sticky top-0 z-30 shadow-xs bg-slate-800 text-white"></thead>
                    <tbody id="tbody-detalle-costos2" class="divide-y divide-slate-100 bg-white">
                        <tr>
                            <td colspan="15" class="text-center py-16 text-slate-400">
                                <div class="flex flex-col items-center justify-center gap-2">
                                    <i class="fa-regular fa-folder-open text-3xl text-slate-300"></i>
                                    <span class="text-sm font-medium">Seleccione los filtros y haga clic en "Cargar" para visualizar la matriz.</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot id="tfoot-detalle-costos2" class="sticky bottom-0 z-30 bg-blue-50/90 shadow-2xs"></tfoot>
                </table>
            </div>
        </div>

    </div>

    <!-- TOOLTIP FLOTANTE TABLEAU -->
    <div id="tooltip-tableau-costos2"
        class="hidden fixed z-50 pointer-events-none bg-white text-slate-800 text-[11px] rounded-xs shadow-2xl border border-slate-300 p-3 min-w-[240px] max-w-[360px] font-sans transition-opacity duration-75">
    </div>

    <!-- SCRIPTS Y DEPENDENCIAS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <script src="../../assets/utils-graficos/periodo-helper.js"></script>
    <script src="costosDias2.service.js?v=20260911_1"></script>
    <script src="costosDias2.controller.js?v=20260911_1"></script>
</body>

</html>
