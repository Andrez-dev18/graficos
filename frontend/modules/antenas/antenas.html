<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectividad Antenas</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .antena-fila-activa > td {
            background-color: #eff6ff !important;
        }

        .antena-fila-activa > td.antena-sticky,
        .antena-grupo-activo {
            background-color: #dbeafe !important;
        }

        .antena-col-activa {
            background-color: #dbeafe !important;
        }

        .antena-sticky-last {
            box-shadow: 3px 0 6px -2px rgba(15, 23, 42, 0.18);
        }

        .antena-fin-hora {
            border-right-width: 2px !important;
            border-right-color: #cbd5e1 !important;
        }

        th.antena-col-activa {
            background-color: #1d4ed8 !important;
            color: #ffffff !important;
        }

        th.antena-fecha-activa {
            background-color: #1e40af !important;
            color: #ffffff !important;
        }

        .antena-foco-fila > td {
            background-color: #dbeafe !important;
        }

        .antena-foco-fila > td.antena-sticky,
        .antena-foco-grupo {
            background-color: #bfdbfe !important;
        }

        .antena-foco-col {
            background-color: #bfdbfe !important;
        }

        th.antena-foco-col {
            background-color: #1d4ed8 !important;
            color: #ffffff !important;
        }

        th.antena-foco-fecha {
            background-color: #1e40af !important;
            color: #ffffff !important;
        }

        .antena-celda-foco {
            outline: 2px solid #0f172a;
            outline-offset: 1px;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 0 0 3px rgba(15, 23, 42, 0.35);
        }

        .antena-contexto-fijo {
            background-color: #eff6ff !important;
            border-color: #bfdbfe !important;
            color: #1e3a8a !important;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen m-0 p-0 font-sans">

    <div id="loader-inicial-pagina"
        class="fixed inset-0 z-50 bg-slate-50/90 backdrop-blur-xs flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="flex flex-col items-center gap-4 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-200/90 text-center max-w-xs mx-4">
            <div class="relative flex items-center justify-center">
                <div class="w-12 h-12 rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-blue-600">
                    <i class="fa-solid fa-wifi text-lg"></i>
                </div>
            </div>
            <div>
                <h3 class="text-sm font-bold text-slate-800">Cargando Conectividad Antenas</h3>
                <p class="text-xs text-slate-500 mt-1">Inicializando filtros y matriz...</p>
            </div>
        </div>
    </div>

    <main class="flex h-screen w-full flex-col gap-2 overflow-hidden" style="overflow-anchor:none;">

        <section class="bg-white rounded-2xl shadow-sm border border-slate-200/80 shrink-0">
            <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-5">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                        <i class="fa-solid fa-wifi text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Conectividad Antenas</h1>
                        <p class="text-xs text-slate-500">Estado de conexión por granja, antena, día y hora</p>
                    </div>
                </div>

                <button id="btn-toggle-filtros" type="button" aria-expanded="true"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <i id="icon-toggle-filtros" class="fa-solid fa-chevron-up"></i>
                </button>
            </div>

            <div id="contenedor-filtros-contenido" class="px-4 pb-4 sm:px-5 border-t border-slate-100">
                <div class="flex flex-wrap items-end gap-3 pt-3">
                    <div class="flex flex-col">
                        <label for="select-tipo-periodo"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERIODO</label>
                        <select id="select-tipo-periodo"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[170px]">
                            <option value="entre_fechas" selected>Entre fechas</option>
                            <option value="por_fecha">Por fecha</option>
                            <option value="ultima_semana">Última semana</option>
                            <option value="por_mes">Por mes</option>
                            <option value="entre_meses">Entre meses</option>
                            <option value="entre_semanas">Entre semanas</option>
                        </select>
                    </div>
                    <div id="contenedor-inputs-periodo" class="flex items-end gap-2"></div>

                    <div class="flex flex-col">
                        <label for="select-filtro-granja"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">GRANJA</label>
                        <select id="select-filtro-granja"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[170px]">
                            <option value="">Todas las granjas</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label for="select-filtro-antena"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">ANTENA</label>
                        <select id="select-filtro-antena"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[170px]">
                            <option value="">Todas las antenas</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label for="select-filtro-estado"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">ESTADO</label>
                        <select id="select-filtro-estado"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer min-w-[150px]">
                            <option value="todos">Todos</option>
                            <option value="fallas">Solo fallas</option>
                            <option value="conectados">Solo conectados</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label for="input-busqueda-antena"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">BUSCAR</label>
                        <input id="input-busqueda-antena" type="text" placeholder="Granja o antena..."
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all min-w-[170px]">
                    </div>

                    <button id="btn-limpiar-vista" type="button" title="Limpia solo los filtros de vista"
                        class="flex items-center justify-center gap-1.5 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-xs rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <i class="fa-solid fa-filter-circle-xmark"></i>
                        <span>Limpiar vista</span>
                    </button>

                    <div class="flex items-center gap-2 ml-auto">
                        <button id="btn-cargar" type="button"
                            class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                            <i class="fa-solid fa-rotate"></i>
                            <span>Cargar</span>
                        </button>
                        <button id="btn-limpiar" type="button"
                            class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                            <span>Limpiar</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <p id="mensaje-error" class="hidden text-xs font-semibold text-red-600"></p>

        <section id="contenedor-antenas" class="flex-1 min-h-0" style="contain:layout;"></section>
    </main>

    <script src="../../core/config.js"></script>
    <script src="../../assets/utils-graficos/periodo-helper.js?v=20261028_1"></script>
    <script src="../../assets/utils-graficos/loading-helper.js?v=20261117_2"></script>
    <script src="antenas.service.js?v=20261125_1"></script>
    <script src="charts/chart.conectividad.js?v=20261125_8"></script>
    <script src="antenas.controller.js?v=20261125_4"></script>
</body>

</html>
