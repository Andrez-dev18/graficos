<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas 2025 - Ventas por Coorporativo - Cliente</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .custom-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f8fafc;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen m-0 p-0 font-sans">

    <!-- LOADER INICIAL DE PÁGINA (CARGA DE FILTROS Y CONFIGURACIÓN) -->
    <div id="loader-inicial-pagina"
        class="fixed inset-0 z-50 bg-slate-50/90 backdrop-blur-xs flex flex-col items-center justify-center transition-opacity duration-300">
        <div
            class="flex flex-col items-center gap-4 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-200/90 text-center max-w-xs mx-4">
            <div class="relative flex items-center justify-center">
                <div class="w-12 h-12 rounded-full border-4 border-blue-100 border-t-blue-600 animate-spin"></div>
                <div class="absolute inset-0 flex items-center justify-center text-blue-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                </div>
            </div>
            <div>
                <h3 class="text-sm font-bold text-slate-800">Cargando Ventas 2025</h3>
                <p class="text-xs text-slate-500 mt-1">Obteniendo configuración y filtros...</p>
            </div>
        </div>
    </div>

    <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">
        
        <!-- BARRA SUPERIOR DE CABECERA Y TOGGLE -->
        <div id="cabecera-filtros"
            class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl transition-all">
            <div class="flex items-center gap-3 px-4 py-3 sm:px-5">
                <div class="p-2.5 bg-blue-50 text-blue-600 rounded-xl">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">Ventas 2025</h1>
                    <p class="text-xs text-slate-500">Ventas por Coorporativo - Cliente</p>
                </div>
            </div>

            <!-- BOTÓN TOGGLE DE FILTROS -->
            <div class="flex items-center gap-2 px-3 py-2 sm:px-4">
                <button id="btn-toggle-filtros" type="button"
                    class="flex items-center gap-2 px-3 py-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200/80 rounded-lg border border-slate-200/80 transition-all shadow-2xs focus:outline-none cursor-pointer">
                    <span id="label-toggle-filtros">Ocultar filtros</span>
                    <svg id="icon-toggle-filtros" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DE FILTROS -->
        <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
            <div class="flex flex-wrap items-end gap-3 sm:gap-4">
                
                <!-- 1. SELECTORES DE FILTRO -->
                <div class="flex flex-wrap items-end gap-3">
                               
                    <!-- RANGO DE FECHAS (FecProceso) -->
                    <div class="flex flex-col">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">FECHA INICIO</label>
                        <input type="date" id="input-fecha-inicio" value="2025-06-01"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                    </div>

                    <div class="flex flex-col">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">FECHA FIN</label>
                        <input type="date" id="input-fecha-fin" value="2025-06-21"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-semibold rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                    </div>

                    <!-- SELECT TIPO DE REPORTE / DASHBOARD -->
                    <div class="flex flex-col">
                        <label for="select-tipo-grafico"
                            class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO GRAFICO</label>
                        <select id="select-tipo-grafico"
                            class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-semibold rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="Todos" selected>Todos</option>
                            <option value="Cantidad">Cantidad</option>
                            <option value="Peso">Peso</option>
                            <option value="Valor">Valor</option>
                        </select>
                    </div>

                    <!-- MULTI-SELECT COORPORATIVO -->
                    <div id="wrapper-filtro-coorporativo" class="flex flex-col relative">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">COORPORATIVO</label>
                        <button id="ms-coorporativo-btn" type="button"
                            class="w-full sm:w-auto min-w-[210px] max-w-[260px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                            <span id="ms-coorporativo-label" class="truncate font-semibold text-slate-800">(Todo)</span>
                            <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="ms-coorporativo-dropdown"
                            class="custom-multiselect-dropdown absolute left-0 top-full z-50 mt-1.5 w-72 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                            <div class="relative mb-2">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </div>
                                <input type="text" id="ms-coorporativo-search" placeholder="Buscar corporativo..."
                                    class="w-full pl-9 pr-3 py-1.5 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800">
                            </div>
                            <div id="ms-coorporativo-options" class="max-h-60 overflow-y-auto space-y-0.5 pr-1 custom-scrollbar"></div>
                        </div>
                    </div>

                    <!-- MULTI-SELECT PROVINCIA -->
                    <div id="wrapper-filtro-provincia" class="flex flex-col relative">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PROVINCIA</label>
                        <button id="ms-provincia-btn" type="button"
                            class="w-full sm:w-auto min-w-[170px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                            <span id="ms-provincia-label" class="truncate font-semibold text-slate-800">(Todo)</span>
                            <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="ms-provincia-dropdown"
                            class="custom-multiselect-dropdown absolute left-0 top-full z-50 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                            <div class="relative mb-2">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </div>
                                <input type="text" id="ms-provincia-search" placeholder="Buscar provincia..."
                                    class="w-full pl-9 pr-3 py-1.5 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800">
                            </div>
                            <div id="ms-provincia-options" class="max-h-60 overflow-y-auto space-y-0.5 pr-1 custom-scrollbar"></div>
                        </div>
                    </div>

                    <!-- MULTI-SELECT TDOC -->
                    <div id="wrapper-filtro-tdoc" class="flex flex-col relative">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TDOC</label>
                        <button id="ms-tdoc-btn" type="button"
                            class="w-full sm:w-auto min-w-[160px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-xs sm:text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                            <span id="ms-tdoc-label" class="truncate font-semibold text-slate-800">(Todo)</span>
                            <svg class="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div id="ms-tdoc-dropdown"
                            class="custom-multiselect-dropdown absolute left-0 top-full z-50 mt-1.5 w-60 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                            <div class="relative mb-2">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </div>
                                <input type="text" id="ms-tdoc-search" placeholder="Buscar tipo doc..."
                                    class="w-full pl-9 pr-3 py-1.5 text-xs border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 text-slate-800">
                            </div>
                            <div id="ms-tdoc-options" class="max-h-60 overflow-y-auto space-y-0.5 pr-1 custom-scrollbar"></div>
                        </div>
                    </div>
                    
                </div>

                <!-- BOTONES DE ACCIÓN -->
                <div class="flex items-center gap-2 ml-auto sm:ml-0">
                    <button id="btn-cargar" type="button"
                        class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 transition-all cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        <span>Cargar</span>
                    </button>
                    <button id="btn-limpiar" type="button"
                        class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200 transition-all cursor-pointer">
                        <span>Limpiar</span>
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- CONTENEDOR PRINCIPAL ESTÁNDAR DE GRÁFICOS / PANELES -->
    <div id="contenedor-graficos-lista" class="flex flex-col gap-6 mt-6 pb-12">
        <!-- Renderizado dinámico por ChartRegistry -->
    </div>

    <!-- SCRIPTS Y DEPENDENCIAS -->
    <script src="../../core/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="../../assets/utils-graficos/excel-export-helper.js?v=20260928_1"></script>
    <script src="../../assets/utils-graficos/custom-multiselect.js?v=20260928_1"></script>
    <script src="../../assets/utils-graficos/loading-helper.js"></script>

    <!-- Componentes de Gráficos / Matrices -->
    <script src="charts/chart.dash_ventas2025_todos.js?v=20260928_1"></script>
    <script src="charts/chart.dash_ventas2025_single_metric.js?v=20260928_1"></script>

    <!-- Servicio y Controlador -->
    <script src="Ventas2025.service.js?v=20260928_1"></script>
    <script src="Ventas2025.controller.js?v=20260928_1"></script>
</body>

</html>
