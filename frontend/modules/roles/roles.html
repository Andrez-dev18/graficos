<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - roles y permisos</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="../../assets/fontawesome/css/all.min.css">


    <link rel="stylesheet" href="../../assets/css/dashboard-styles.css">
    <link rel="stylesheet" href="../../assets/css/dashboard-style.css">
    <link rel="stylesheet" href="../../assets/css/dashboard-responsive.css">

</head>

<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">
    <div class="container mx-auto px-4 py-6">

        

        <section class="bg-white rounded-2xl card-shadow p-6 slide-down">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-xl font-bold text-gray-700 flex items-center gap-2">
                    <i class="fas fa-list-ul text-purple-600"></i>
                    Roles Registrados
                </h2>

                <div class="flex items-center gap-4 w-full md:w-auto">
                    <button id="btnNuevoRol"
                        class="bg-blue-800 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow btn-hover-scale flex items-center gap-2 w-full md:w-auto justify-center">
                        <i class="fas fa-plus"></i>
                        Nuevo Rol
                    </button>
                </div>
            </div>

            <div class="table-scroll overflow-x-auto">
                <table class="min-w-full" id="dataTableRoles">
                    <thead
                        class="bg-gradient-to-r from-blue-800 to-indigo-700 text-white sticky top-0 text-sm uppercase">
                        <tr>
                            <th class="px-4 py-3 text-center font-semibold w-12">#</th>
                            <th class="px-4 py-3 text-left font-semibold w-32">Código</th>
                            <th class="px-4 py-3 text-left font-semibold">Nombre del Rol</th>
                            <th class="px-4 py-3 text-left font-semibold">Descripción</th>
                            <th class="px-4 py-3 text-center font-semibold w-24">Módulos</th>
                            <th class="px-4 py-3 text-center font-semibold w-28">Estado</th>
                            <th class="px-4 py-3 text-center font-semibold w-32">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBodyRoles" class="text-sm text-gray-700 divide-y divide-gray-200">
                        
                    </tbody>
                </table>
            </div>
        </section>


    </div>

    <div id="modalRol"
        class="fixed inset-0 bg-black bg-opacity-50 hidden items-start justify-center z-50 p-4 pt-10 transition-opacity"
        style="display: none; overflow-y: auto;">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full transform transition-all mb-10">

            <div
                class="bg-gradient-to-r from-blue-800 to-blue-800 p-3 rounded-t-2xl flex justify-between items-center">
                <h3 id="modalRolTitle" class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-plus-circle"></i> Nuevo Rol
                </h3>
                <button id="btnCerrarModalRol" class="text-white hover:text-gray-200 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="p-6">
                <form id="formRol" class="space-y-3">
                    <input type="hidden" id="rol_id" name="id">
                    <input type="hidden" id="rol_is_edit" name="is_edit" value="false">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Código del Rol *</label>
                            <div class="relative">
                                <i
                                    class="fas fa-tag absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="rol_codigo" name="cod_rol" required placeholder="Ej: SUPERVISOR"
                                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none uppercase font-mono">
                            </div>
                            <p class="text-xs text-gray-400 mt-1">Sin espacios. Usar letras, números y guiones bajos.
                            </p>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Rol *</label>
                            <div class="relative">
                                <i
                                    class="fas fa-id-badge absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                <input type="text" id="rol_nombre" name="nom_rol" required
                                    placeholder="Ej: Supervisor de Operaciones"
                                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                            <div class="relative">
                                <i class="fas fa-align-left absolute left-3 top-3 text-gray-400"></i>
                                <textarea id="rol_descripcion" name="descripcion" rows="2"
                                    placeholder="Breve descripción de las funciones del rol..."
                                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none resize-none"></textarea>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Programa *</label>
                            <div class="relative">
                                <i
                                    class="fas fa-desktop absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                <select id="rol_programa" name="id_programa" required
                                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none bg-gray-50 cursor-not-allowed">
                                    <option value="5" selected>5 - Sistema Graficos</option>
                                </select>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">Programa base de los módulos.</p>
                        </div>
                    </div>

                    <div class="border border-gray-200 rounded-xl overflow-hidden mt-4">
                        <div class="bg-gray-50 p-3 border-b border-gray-200 flex justify-between items-center">
                            <h4 class="font-bold text-gray-700 text-sm flex items-center gap-2">
                                <i class="fas fa-sitemap text-purple-600"></i> Módulos del menú permitidos
                            </h4>
                            <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded font-semibold"
                                id="contadorPermisos">0 seleccionados</span>
                        </div>

                        <div id="arbolPermisosContainer" class="p-4 max-h-80 overflow-y-auto bg-white space-y-4">

                            <div class="modulo-grupo border border-gray-100 rounded-lg p-3 bg-gray-50/50">
                                <div class="flex justify-between items-center mb-2 border-b border-gray-200 pb-2">
                                    <label
                                        class="font-bold text-purple-800 flex items-center gap-2 cursor-pointer select-none">
                                        <input type="checkbox"
                                            class="check-grupo rounded text-purple-600 focus:ring-purple-500 w-4 h-4 cursor-pointer">
                                        <i class="fas fa-folder-open text-yellow-500"></i> 1. Oferta
                                    </label>
                                    <button type="button"
                                        class="btn-select-all text-xs text-blue-600 hover:text-blue-800 font-semibold hover:underline">Sel.
                                        todo</button>
                                </div>
                                <div class="pl-7 space-y-2 mt-2">
                                    <label
                                        class="flex items-center gap-2 cursor-pointer text-sm text-gray-700 hover:bg-white p-1.5 rounded transition-colors border border-transparent hover:border-gray-200 select-none">
                                        <input type="checkbox"
                                            class="check-item rounded text-purple-600 focus:ring-purple-500 w-4 h-4 cursor-pointer">
                                        <i class="fas fa-link text-gray-400 text-xs"></i> 1.1. Pollo Arequipa
                                    </label>
                                    <label
                                        class="flex items-center gap-2 cursor-pointer text-sm text-gray-700 hover:bg-white p-1.5 rounded transition-colors border border-transparent hover:border-gray-200 select-none">
                                        <input type="checkbox"
                                            class="check-item rounded text-purple-600 focus:ring-purple-500 w-4 h-4 cursor-pointer">
                                        <i class="fas fa-link text-gray-400 text-xs"></i> 1.2. Pollo Vivo Provincias
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-2">
                        <button type="button" id="btnCancelarRol"
                            class="px-6 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg font-semibold transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" id="btnGuardarRol"
                            class="px-6 py-2 text-white bg-blue-700 hover:bg-blue-800 rounded-lg font-semibold shadow transition-colors flex items-center gap-2">
                            <i class="fas fa-save"></i> Guardar Rol
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50"
        style="display: none;">
        <div class="bg-white p-6 rounded-xl shadow-2xl">
            <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-2"></i>
            <p class="text-gray-700">Cargando...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="../../core/config.js"></script>
    <script src="roles.service.js"></script>
    <script src="roles.controller.js"></script>

  

</body>

</html>
