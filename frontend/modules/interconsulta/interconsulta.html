<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interconsultas</title>
    <script>
        (function() {
            var k = 'ix2-theme',
                mode = null;
            try {
                var s = localStorage.getItem(k);
                if (s === 'dark' || s === 'light') mode = s;
            } catch (e) {}
            if (mode == null) {
                try {
                    var m = document.cookie.match(/(?:^|; )ix2-theme=([^;]*)/);
                    if (m) {
                        var c = decodeURIComponent(m[1]);
                        if (c === 'dark' || c === 'light') mode = c;
                    }
                } catch (e2) {}
            }
            if (mode == null) mode = 'light';
            document.documentElement.setAttribute('data-theme', mode);
            document.documentElement.style.colorScheme = mode === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body,
        select,
        input,
        button,
        textarea {
            font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
        }

        .dropdown-enter {
            animation: fadeInDown 0.15s ease-out forwards;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="">
    <div class="w-full space-y-4">

        <!-- CONTENEDOR TARJETA BLANCA DE FILTROS PERSONALIZADOS CON TABS INTEGRADOS (UNA SOLA PIEZA) -->
        <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-200/80 relative">

            <!-- BARRA SUPERIOR DE TABS ALINEADA AL BORDE EXTERIOR -->
            <div id="cabecera-filtros" class="flex flex-wrap items-center justify-between bg-white border-b border-slate-200/80 rounded-t-2xl transition-all">
                <!-- TABS INTEGRADOS AL RAS DEL BORDE SUPERIOR E IZQUIERDO -->
                <div class="flex items-center -mb-px">
                    <!-- TAB 1: ACTIVO (Esquina superior izquierda continua con el contenedor) -->
                    <button type="button" id="tab-graficos-dinamicos" class="flex items-center gap-2.5 px-5 py-3.5 text-xs sm:text-sm font-bold bg-white text-blue-600 border-r border-slate-200/80 rounded-tl-2xl z-10 transition-all cursor-pointer">
                        <div class="p-1.5 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path>
                            </svg>

                    <!-- TAB 2: INACTIVO -->

                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
                            </svg>
                        </div>
                        <span class="leading-none font-semibold">Gráficos Horizontales</span>
                    </button>
                </div>

                <!-- BOTÓN TOGGLE PLEGAR / DESPLEGAR -->
                <div class="px-3 py-2 sm:px-4">

                        </svg>
                    </button>
                </div>
            </div>

            <!-- FILA DE CONTROLES ORGANIZADOS EN SECCIONES REUTILIZABLES (PLEGABLE) -->
            <div id="contenedor-filtros-contenido" class="p-4 sm:p-5 transition-all duration-300">
                <div class="flex flex-wrap items-end gap-3 sm:gap-4">

                    <!-- 1. BOTÓN CONFIGURACIÓN PERIODO GRANJAS (Abre Modal) -->
                    <div class="flex flex-col">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PERIODO GRANJAS</label>

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                            <span id="label-resumen-periodo" class="truncate max-w-[170px]">Entre fechas</span>
                            <svg class="w-3.5 h-3.5 text-slate-400 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>

                    <!-- SWITCH UNIFICAR FILTROS DE UBICACIÓN -->

                    </div>
                    <!-- CONTENEDOR FILTROS DE UBICACIÓN SEPARADOS -->
                    <div id="contenedor-ubicacion-separados" class="contents">
                        <!-- 4. MULTI-SELECT GRANJA -->
                        <div class="flex flex-col relative">
                            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">GRANJA</label>

                                <span id="ms-granja-label" class="truncate">Seleccionar granja</span>
                                <svg class="w-4 h-4 text-slate-500 flex-shrink-0 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>

                            <div id="ms-granja-dropdown" class="custom-multiselect-dropdown dropdown-enter absolute left-0 top-full z-50 mt-1.5 w-72 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                                <div class="relative mb-2">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">

                                </div>
                                <div id="ms-granja-options" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>
                            </div>
                        </div>

                        <!-- 5. MULTI-SELECT CAMPAÑA -->
                        <div class="flex flex-col relative">
                            <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">CAMPAÑA</label>
                            <button id="ms-campania-btn" type="button" class="w-full sm:w-auto min-w-[140px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                                <span id="ms-campania-label" class="truncate">Seleccionar campaña</span>
                                <svg class="w-4 h-4 text-slate-500 flex-shrink-0 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>

                            <div id="ms-campania-dropdown" class="custom-multiselect-dropdown dropdown-enter absolute left-0 top-full z-50 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">

                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">

                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>

                            <button id="ms-galpon-btn" type="button" class="w-full sm:w-auto min-w-[140px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                                <span id="ms-galpon-label" class="truncate">Seleccionar galpón</span>
                                <svg class="w-4 h-4 text-slate-500 flex-shrink-0 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>

                            <div id="ms-galpon-dropdown" class="custom-multiselect-dropdown dropdown-enter absolute left-0 top-full z-50 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                                <div class="relative mb-2">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                        </svg>
                                    </div>
                                    <input type="text" id="ms-galpon-search" placeholder="Buscar galpón..." class="w-full pl-9 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-50 text-slate-800 placeholder-slate-400">
                                </div>
                                <div id="ms-galpon-options" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>
                            </div>
                        </div>
                    </div>

                    <!-- CONTENEDOR FILTRO DE UBICACIÓN UNIFICADO (JERÁRQUICO) -->
                    <div id="contenedor-ubicacion-unificado" class="flex flex-col relative hidden">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">GRANJAS, CAMPAÑAS Y GALPONES</label>
                        <button id="ms-unificado-btn" type="button" class="w-full sm:w-auto min-w-[260px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                            <span id="ms-unificado-label" class="truncate text-slate-400 font-normal">Ninguno seleccionado</span>
                            <svg class="w-4 h-4 text-slate-500 flex-shrink-0 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>

                        <div id="ms-unificado-dropdown" class="custom-multiselect-dropdown dropdown-enter absolute left-0 top-full z-50 mt-1.5 w-80 sm:w-96 bg-white rounded-xl shadow-xl border border-slate-200 p-3 hidden">
                            <div class="relative mb-2.5">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">

                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </div>
                                <input type="text" id="ms-unificado-search" placeholder="Buscar granja, campaña o galpón..." class="w-full pl-9 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-50 text-slate-800 placeholder-slate-400">

                            <!-- Botones Rápidos -->

                                <button type="button" id="btn-unificado-limpiar" class="text-slate-500 hover:text-rose-600 font-medium transition cursor-pointer flex items-center gap-1">
                                    <svg class="w-3.5 h-3.5 text-slate-400 hover:text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>

                        </div>
                    </div>

                    <!-- 7. FILTRO GENERAL SEXO -->
                    <div class="flex flex-col">
                        <label for="select-sexo-global" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">SEXO</label>
                        <select id="select-sexo-global" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="macho" selected>Macho</option>
                            <option value="hembra">Hembra</option>
                            <option value="ambos">Ambos</option>
                        </select>
                    </div>

                    <!-- 8. MULTI-SELECT TIPO DE GRÁFICOS -->
                    <div class="flex flex-col relative">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TIPO DE GRÁFICOS</label>
                        <button id="ms-graficos-btn" type="button" class="w-full sm:w-auto min-w-[200px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                            <span id="ms-graficos-label" class="truncate">Seleccionar tipo</span>

                            </div>
                            <div id="ms-graficos-options" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>

                    </div>

                    <!-- SELECT MODO COMBINADO -->
                    <div class="flex flex-col">
                        <label for="select-modo-combinado" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">MODO COMBINADO</label>

                            <option value="tipo">Combinar Tipos de Gráfico</option>
                            <option value="granja">Combinar Granjas / Campañas</option>
                        </select>
                    </div>

                    <!-- ESTILO DE GRÁFICO (LÍNEA / BARRAS) -->
                    <div class="flex flex-col">
                        <label for="select-tipo-visualizacion" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">ESTILO DE GRÁFICO</label>

                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                                </svg>
                            </div>
                            <select id="select-tipo-visualizacion" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg pl-8 pr-8 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer appearance-none">
                                <option value="default" selected>Personalizado</option>

                                <input type="text" id="ms-graficos-search-hz" placeholder="Buscar tipo de gráfico..." class="w-full pl-9 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-50 text-slate-800 placeholder-slate-400">
                            </div>
                            <div id="ms-graficos-options-hz" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>
                        </div>
                    </div>

                    <!-- MODO COMBINACIÓN DE GRÁFICOS (TAB 2) -->
                    <div class="flex flex-col">
                        <label for="select-modo-combinado-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">MODO COMBINACIÓN</label>
                        <select id="select-modo-combinado-hz" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="ninguno" selected>Sin combinar (Individual)</option>
                            <option value="tipo">Combinar Tipos de Gráfico</option>
                        </select>
                    </div>

                    <!-- 6. CHECK LÍNEAS CURVAS -->
                    <div class="flex flex-col">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">CURVATURA</label>
                        <label for="check-lineas-suaves-hz" class="h-[38px] flex items-center gap-2 cursor-pointer select-none bg-white border border-slate-300 hover:border-slate-400 rounded-lg px-3 shadow-sm transition-all focus-within:ring-2 focus-within:ring-blue-500/20">
                            <input type="checkbox" id="check-lineas-suaves-hz" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300 transition cursor-pointer">
                            <span class="text-xs font-semibold text-slate-700 whitespace-nowrap">Líneas Curvas</span>
                        </label>
                    </div>

                    <!-- 7. INPUT FECHA INICIO -->
                    <div class="flex flex-col">
                        <label for="input-fecha-inicio-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">FECHA INICIO</label>
                        <input type="date" id="input-fecha-inicio-hz" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3 py-1.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                    </div>

                    <!-- 8. INPUT FECHA FIN -->
                    <div class="flex flex-col">
                        <label for="input-fecha-fin-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">FECHA FIN</label>
                        <input type="date" id="input-fecha-fin-hz" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3 py-1.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                    </div>

                    <!-- 9. INPUT SEMANA (NUMÉRICO) -->
                    <div id="container-filtro-semana-hz" class="flex flex-col">
                        <label for="input-semana-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">SEMANA</label>
                        <input type="number" id="input-semana-hz" min="1" max="10" value="1" placeholder="Semana #" class="w-24 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3 py-1.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    </div>

                    <!-- 9.1. MULTI-SELECT DÍAS DE PESAJE (DINÁMICO SEGÚN TIPO) -->
                    <div id="container-filtro-dias-pesaje-hz" class="hidden flex-col relative">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">DÍAS DE PESAJE/GANANCIA</label>
                        <button id="ms-dias-pesaje-btn-hz" type="button" class="w-full sm:w-auto min-w-[170px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                            <span id="ms-dias-pesaje-label-hz" class="truncate">Seleccionar días</span>
                            <svg class="w-4 h-4 text-slate-500 flex-shrink-0 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>

                        <div id="ms-dias-pesaje-dropdown-hz" class="custom-multiselect-dropdown dropdown-enter absolute left-0 top-full z-50 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                            <div class="relative mb-2">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </div>
                                <input type="text" id="ms-dias-pesaje-search-hz" placeholder="Buscar día..." class="w-full pl-9 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-50 text-slate-800 placeholder-slate-400">
                            </div>
                            <div id="ms-dias-pesaje-options-hz" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>
                        </div>
                    </div>

                    <!-- 10. CONTROL DE TAMAÑO DE TEXTO (A- / A+) -->
                    <div class="flex flex-col">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TAMAÑO TEXTO</label>
                        <div class="h-[38px] flex items-center bg-white border border-slate-300 rounded-lg p-0.5 shadow-sm">
                            <button type="button" id="btn-tamano-texto-dec-hz" class="px-2.5 h-full flex items-center justify-center text-slate-600 hover:text-blue-600 hover:bg-slate-100 active:bg-slate-200 rounded-md transition-all cursor-pointer font-bold text-xs select-none" title="Disminuir tamaño de letra del gráfico">
                                <span class="font-extrabold text-sm">A−</span>
                            </button>
                            <span id="label-tamano-texto-hz" class="px-2 text-[11px] font-bold text-slate-600 select-none min-w-[44px] text-center border-x border-slate-200">100%</span>
                            <button type="button" id="btn-tamano-texto-inc-hz" class="px-2.5 h-full flex items-center justify-center text-slate-600 hover:text-blue-600 hover:bg-slate-100 active:bg-slate-200 rounded-md transition-all cursor-pointer font-bold text-xs select-none" title="Aumentar tamaño de letra del gráfico">
                                <span class="font-extrabold text-sm">A+</span>
                            </button>
                        </div>
                    </div>

                    <!-- 11. BOTONES ACCIÓN (CARGAR, LIMPIAR) -->
                    <div class="flex items-center gap-2 ml-auto sm:ml-0">
                        <button id="btn-cargar-hz" type="button" class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 focus:outline-none focus:ring-2 focus:ring-blue-500/40 transition-all cursor-pointer">
                            <svg class="icon-cargar w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            <span>Cargar</span>
                        </button>
                        <button id="btn-limpiar-hz" type="button" class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200/80 shadow-xs focus:outline-none focus:ring-2 focus:ring-slate-400/20 transition-all cursor-pointer">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                            <span>Limpiar</span>
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <div id="status" class="ic-status hidden"></div>

        <!-- TAB 1: SECCIÓN DE GRÁFICOS DINÁMICOS -->
        <div id="seccion-graficos-dinamicos" class="w-full flex flex-col gap-6 transition-all duration-300">
            <div id="contenedor-graficos" class="w-full flex flex-col gap-6">
                <!-- Generado dinámicamente por app.js -->
            </div>

            <!-- MENSAJE DE NO DISPONIBLE -->
            <div id="mensaje-sin-graficos" class="hidden w-full bg-white rounded-2xl p-10 text-center text-slate-500 font-medium border border-slate-200/80 shadow-sm">
                <svg class="w-10 h-10 mx-auto text-slate-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <p class="text-base font-semibold text-slate-700">No hay gráficos disponibles</p>
                <p class="text-xs text-slate-400 mt-1">Ajuste la selección de Granjas, Campañas, Galpones o Tipos de Gráfico para visualizar resultados.</p>
            </div>
        </div>

        <!-- TAB 2: CONTENEDOR DE GRÁFICOS HORIZONTALES -->
        <div id="contenedor-graficos-horizontales" class="w-full flex flex-col gap-6 transition-all duration-300 hidden">
            <!-- Generado dinámicamente para gráficos horizontales -->
        </div>

    <!-- MODAL CONFIGURACIÓN PERIODO GRANJAS -->
    <div id="modal-periodo-granjas" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 hidden transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden transform transition-all scale-95 opacity-0 modal-card-content">
            <!-- Header Modal -->
            <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100 bg-slate-50/50">
                <div class="flex items-center gap-2.5">
                    <div class="p-2 bg-blue-50 text-blue-600 rounded-xl border border-blue-100 shadow-2xs">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-slate-800">Filtro de Periodo de Granjas</h3>
                        <p class="text-[11px] text-slate-400">Define el rango de fechas o periodo para las granjas</p>
                    </div>
                </div>
                <button type="button" id="btn-cerrar-modal-periodo" class="text-slate-400 hover:text-slate-600 hover:bg-slate-100 p-1.5 rounded-lg transition cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Body Modal -->
            <div class="p-5 space-y-4">
                <!-- Select de Periodo -->
                <div class="flex flex-col gap-1.5">
                    <label for="select-periodo" class="text-xs font-bold text-slate-700">Tipo de Periodo</label>
                    <select id="select-periodo" class="w-full bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-xl px-3.5 py-2.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                        <option value="por_mes">Por mes</option>
                        <option value="entre_meses">Entre meses</option>
                        <option value="por_fecha">Por fecha</option>
                        <option value="entre_fechas" selected>Entre fechas</option>
                        <option value="ultima_semana">Última Semana</option>
                        <option value="entre_semanas">Entre semanas</option>
                    </select>
                </div>

                <!-- Inputs de Fechas Dinámicos -->
                <div class="flex flex-col gap-1.5 pt-1">
                    <label class="text-xs font-bold text-slate-700">Fechas o Rango Seleccionado</label>
                    <div id="contenedor-fechas-dinamicas" class="w-full">
                        <!-- Generado dinámicamente por JS -->
                    </div>
                </div>
            </div>

            <!-- Footer Modal -->
            <div class="flex items-center justify-end gap-2 px-5 py-3.5 bg-slate-50 border-t border-slate-100">
                <button type="button" id="btn-cancelar-modal-periodo" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:text-slate-800 hover:bg-slate-200/60 rounded-xl transition cursor-pointer">
                    Cancelar
                </button>
                <button type="button" id="btn-aplicar-modal-periodo" class="px-4 py-2 text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-md shadow-blue-500/20 transition flex items-center gap-1.5 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span>Aplicar Fechas</span>
                </button>
            </div>
        </div>
    </div>

        <!-- Scripts JavaScript del Dashboard Modularizado -->
        <script src="js/interconsultas-multiselect.js"></script>
        <script src="js/interconsultas-utils.js"></script>
        <script src="js/interconsultas-types.js"></script>
        <script src="js/interconsultas-charts.js"></script>
        <script src="js/interconsultas-render.js"></script>
        <script src="js/interconsultas-horizontales-render.js"></script>
        <script src="app.js"></script>


</body>

</html>
