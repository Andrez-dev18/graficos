<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interconsultas</title>
    <script>
        (function() {
            var k = 'ix2-theme',
                mode = null;
            try {
                var s = localStorage.getItem(k);
                if (s === 'dark' || s === 'light') mode = s;
            } catch (e) {}
            if (mode == null) {
                try {
                    var m = document.cookie.match(/(?:^|; )ix2-theme=([^;]*)/);
                    if (m) {
                        var c = decodeURIComponent(m[1]);
                        if (c === 'dark' || c === 'light') mode = c;
                    }
                } catch (e2) {}
            }
            if (mode == null) mode = 'light';
            document.documentElement.setAttribute('data-theme', mode);
            document.documentElement.style.colorScheme = mode === 'dark' ? 'dark' : 'light';
        })();
    </script>
    <link rel="stylesheet" href="css/interconsultas-theme.css">
    <link rel="stylesheet" href="../../assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }

    <style>
        body,
        select,
        input,
        button,
        textarea {
            font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
        }

        .dropdown-enter {
            animation: fadeInDown 0.15s ease-out forwards;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hz-legend-dock {
            position: fixed;
            left: 50%;
            bottom: 1.25rem;
            transform: translateX(-50%);
            z-index: 45;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.5rem 1.1rem;
            padding: 0.55rem 1.1rem;
            background: var(--sip-surface, #fff);
            border: 1px solid var(--sip-border, #e2e8f0);
            border-radius: 9999px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.14);
            pointer-events: none;
            max-width: min(96vw, 760px);
        }

        html[data-theme="dark"] .hz-legend-dock {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .hz-legend-dock.hidden {
            display: none;
        }

        .chart-stack:fullscreen,
        .chart-stack:-webkit-full-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            height: 100%;
            background: var(--sip-bg, #fff);
            padding: 1rem 1.25rem;
            box-sizing: border-box;
            overflow: hidden;
        }

        .chart-pct-wrapper {
            overflow: hidden;
            min-height: 0;
        }

        .chart-canvas-wrapper {
            overflow: hidden;
            min-height: 0;
        }

        .chart-stack:fullscreen .chart-pct-wrapper,
        .chart-stack:-webkit-full-screen .chart-pct-wrapper {
            flex-shrink: 0;
            width: 100%;
            min-height: 150px;
            overflow: hidden;
        }

        .chart-stack:fullscreen .chart-canvas-wrapper,
        .chart-stack:-webkit-full-screen .chart-canvas-wrapper {
            flex: 1 1 auto;
            width: 100%;
            min-height: 240px;
        }

        .chart-card-legend {
            margin-top: 8px;
        }

        .hz-legend-dock-item {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--sip-text, #334155);
            white-space: nowrap;
        }

        .hz-legend-dock-swatch {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
    </style>
</head>

                                <input type="text" id="ms-graficos-search-hz" placeholder="Buscar tipo de gráfico..." class="w-full pl-9 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-50 text-slate-800 placeholder-slate-400">
                            </div>
                            <div id="ms-graficos-options-hz" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>
                        </div>
                    </div>

                    <!-- 6. CHECK LÍNEAS CURVAS -->
                    <div class="flex flex-col">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">CURVATURA</label>
                        <label for="check-lineas-suaves-hz" class="h-[38px] flex items-center gap-2 cursor-pointer select-none bg-white border border-slate-300 hover:border-slate-400 rounded-lg px-3 shadow-sm transition-all focus-within:ring-2 focus-within:ring-blue-500/20">
                            <input type="checkbox" id="check-lineas-suaves-hz" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300 transition cursor-pointer">
                            <span class="text-xs font-semibold text-slate-700 whitespace-nowrap">Líneas Curvas</span>
                        </label>
                    </div>

                    <!-- 7. INPUT FECHA INICIO -->
                    <div class="flex flex-col">
                        <label for="input-fecha-inicio-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">FECHA INICIO</label>
                        <input type="date" id="input-fecha-inicio-hz" value="2025-01-01" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3 py-1.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                    </div>

                    <!-- 8. INPUT FECHA FIN -->
                    <div class="flex flex-col">
                        <label for="input-fecha-fin-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">FECHA FIN</label>
                        <input type="date" id="input-fecha-fin-hz" value="2026-10-05" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3 py-1.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                    </div>

                    <!-- 9. INPUT SEMANA (NUMÉRICO) -->
                    <div id="container-filtro-semana-hz" class="flex flex-col">
                        <label for="input-semana-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">SEMANA</label>
                        <input type="number" id="input-semana-hz" min="1" max="10" value="1" placeholder="Semana #" class="w-24 bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3 py-1.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                    </div>

                    <!-- 9.1. LUMINOMETRÍA (modo / punto) -->
                    <div id="container-filtro-lum-modo-hz" class="hidden flex-col">
                        <label for="select-lum-modo-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">AGRUPACIÓN LUM</label>
                        <select id="select-lum-modo-hz" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="subzona">Por subzona (mes)</option>
                            <option value="granja">Por granja / campaña / galpón</option>
                        </select>
                    </div>
                    <div id="container-filtro-lum-punto-hz" class="hidden flex-col min-w-[200px]">
                        <label for="select-lum-punto-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">PUNTO DETECCIÓN</label>
                        <select id="select-lum-punto-hz" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="">Todos</option>
                        </select>
                    </div>

                    <!-- 9.2. MULTI-SELECT DÍAS DE PESAJE (DINÁMICO SEGÚN TIPO) -->
                    <div id="container-filtro-dias-pesaje-hz" class="hidden flex-col relative">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">DÍAS DE PESAJE/GANANCIA</label>
                        <button id="ms-dias-pesaje-btn-hz" type="button" class="w-full sm:w-auto min-w-[170px] bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm flex items-center justify-between gap-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 transition-all">
                            <span id="ms-dias-pesaje-label-hz" class="truncate">Seleccionar días</span>
                            <svg class="w-4 h-4 text-slate-500 flex-shrink-0 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>

                        <div id="ms-dias-pesaje-dropdown-hz" class="custom-multiselect-dropdown dropdown-enter absolute left-0 top-full z-50 mt-1.5 w-64 bg-white rounded-xl shadow-xl border border-slate-200 p-2.5 hidden">
                            <div class="relative mb-2">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </div>
                                <input type="text" id="ms-dias-pesaje-search-hz" placeholder="Buscar día..." class="w-full pl-9 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-slate-50 text-slate-800 placeholder-slate-400">
                            </div>
                            <div id="ms-dias-pesaje-options-hz" class="max-h-56 overflow-y-auto space-y-0.5 pr-1"></div>
                        </div>
                    </div>

                    <!-- BOTONES ACCIÓN (CARGAR, LIMPIAR) -->
                    <div class="flex items-center gap-2 ml-auto sm:ml-0">
                        <button id="btn-cargar-hz" type="button" class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm rounded-lg shadow-md shadow-blue-500/20 focus:outline-none focus:ring-2 focus:ring-blue-500/40 transition-all cursor-pointer">
                            <svg class="icon-cargar w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            <span>Cargar</span>
                        </button>
                        <button id="btn-limpiar-hz" type="button" class="flex items-center justify-center gap-1.5 px-4 py-2 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold text-sm rounded-lg border border-slate-200/80 shadow-xs focus:outline-none focus:ring-2 focus:ring-slate-400/20 transition-all cursor-pointer">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                            <span>Limpiar</span>
                        </button>
                    </div>

                    </div><!-- /filtros-hz-fila-1 -->

                    <!-- Fila 2: sexo, modo combinación, tamaño de texto -->
                    <div id="filtros-hz-fila-2" class="flex flex-wrap items-end gap-3 sm:gap-4 pt-1 border-t border-slate-100">

                    <div class="flex flex-col">
                        <label for="select-sexo-global-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">SEXO</label>
                        <select id="select-sexo-global-hz" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-medium rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="macho" selected>Macho</option>
                            <option value="hembra">Hembra</option>
                            <option value="ambos">Ambos</option>
                            <option value="combinado">Combinado</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">SEPARAR SEXOS</label>
                        <label for="check-separar-graficos-hz" class="h-[38px] flex items-center gap-2 cursor-pointer select-none bg-white border border-slate-300 hover:border-slate-400 rounded-lg px-3 shadow-sm transition-all focus-within:ring-2 focus-within:ring-blue-500/20">
                            <input type="checkbox" id="check-separar-graficos-hz" class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-slate-300 transition cursor-pointer">
                            <span class="text-xs font-semibold text-slate-700 whitespace-nowrap">Separar</span>
                        </label>
                    </div>

                    <div class="flex flex-col">
                        <label for="select-modo-combinado-hz" class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">MODO COMBINACIÓN</label>
                        <select id="select-modo-combinado-hz" class="bg-white border border-slate-300 hover:border-slate-400 text-slate-800 text-sm font-semibold rounded-lg px-3.5 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
                            <option value="ninguno" selected>Sin combinar (Individual)</option>
                            <option value="tipo">Combinar Tipos de Gráfico</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1 ml-0.5">TAMAÑO TEXTO</label>
                        <div class="h-[38px] flex items-center bg-white border border-slate-300 rounded-lg p-0.5 shadow-sm">
                            <button type="button" id="btn-tamano-texto-dec-hz" class="px-2.5 h-full flex items-center justify-center text-slate-600 hover:text-blue-600 hover:bg-slate-100 active:bg-slate-200 rounded-md transition-all cursor-pointer font-bold text-xs select-none" title="Disminuir tamaño de letra del gráfico">
                                <span class="font-extrabold text-sm">A−</span>
                            </button>
                            <span id="label-tamano-texto-hz" class="px-2 text-[11px] font-bold text-slate-600 select-none min-w-[44px] text-center border-x border-slate-200">100%</span>
                            <button type="button" id="btn-tamano-texto-inc-hz" class="px-2.5 h-full flex items-center justify-center text-slate-600 hover:text-blue-600 hover:bg-slate-100 active:bg-slate-200 rounded-md transition-all cursor-pointer font-bold text-xs select-none" title="Aumentar tamaño de letra del gráfico">
                                <span class="font-extrabold text-sm">A+</span>
                            </button>
                        </div>
                    </div>

                    </div><!-- /filtros-hz-fila-2 -->

                </div>
            </div>
        </div>

        <div id="status" class="ic-status hidden"></div>

        <!-- TAB 1: SECCIÓN DE GRÁFICOS DINÁMICOS -->
        <div id="seccion-graficos-dinamicos" class="w-full flex flex-col gap-6 transition-all duration-300">
            <div id="contenedor-graficos" class="w-full flex flex-col gap-6">
                <!-- Generado dinámicamente por app.js -->
            </div>

            <!-- MENSAJE DE NO DISPONIBLE -->
            <div id="mensaje-sin-graficos" class="hidden w-full bg-white rounded-2xl p-10 text-center text-slate-500 font-medium border border-slate-200/80 shadow-sm">
                <svg class="w-10 h-10 mx-auto text-slate-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <p class="text-base font-semibold text-slate-700">No hay gráficos disponibles</p>
                <p class="text-xs text-slate-400 mt-1">Ajuste la selección de Granjas, Campañas, Galpones o Tipos de Gráfico para visualizar resultados.</p>
            </div>
        </div>

        <!-- TAB 2: CONTENEDOR DE GRÁFICOS HORIZONTALES -->
        <div id="contenedor-graficos-horizontales" class="w-full flex flex-col gap-6 transition-all duration-300 hidden">
            <!-- Generado dinámicamente para gráficos horizontales -->
        </div>

    </div>

    <!-- Scripts JavaScript del Dashboard Modularizado -->
    <script src="js/interconsultas-multiselect.js"></script>
    <script src="js/interconsultas-utils.js"></script>
    <script src="js/interconsultas-types.js"></script>
    <script src="js/interconsultas-charts.js"></script>
    <script src="js/interconsultas-render.js"></script>
    <script src="js/interconsultas-horizontales-render.js"></script>
    <script src="app.js"></script>

</body>

</html>
